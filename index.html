<!DOCTYPE html>
<html lang="es">
<head>
    <title>Congregación Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap">
    <style>
        /* --- RESET TOTAL PARA EVITAR CONFLICTOS --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
            line-height: 1.6;
        }

        .contenido {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #4a148c; /* Morado JW */
            font-size: 2.5rem;
            margin-bottom: 50px;
        }

        h2 {
            font-size: 1.5rem;
            color: #555;
            margin: 40px 0 20px;
            padding-left: 15px;
            border-left: 5px solid #4a148c;
        }

        /* --- GRID DE TARJETAS --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            list-style: none;
        }

        /* --- LA TARJETA (LO QUE LE DA VIDA) --- */
        .card-grid li a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 40px 20px;
            text-decoration: none;
            border-radius: 20px;
            /* Sombra suave */
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid #eaeaea;
            text-align: center;
        }

        /* EFECTO HOVER VIVO */
        .card-grid li a:hover {
            transform: translateY(-10px);
            background-color: #4a148c;
            box-shadow: 0 15px 30px rgba(74, 20, 140, 0.3);
        }

        /* --- ICONOS --- */
        .card-grid li img {
            width: 70px; /* Más grandes */
            height: 70px;
            margin-bottom: 15px; /* Pegado al texto */
            transition: all 0.3s ease;
            /* Forzamos que no tengan floats de estilos viejos */
            float: none !important; 
            display: block;
        }

        /* --- TEXTO --- */
        .card-grid li span {
            font-weight: 700;
            font-size: 1.1rem;
            color: #FF5500; /* Tu naranja original */
            transition: all 0.3s ease;
            /* Quitamos posiciones raras */
            position: static !important;
            float: none !important;
        }

        /* CAMBIO DE COLOR AL HOVER */
        .card-grid li a:hover span {
            color: #ffffff;
        }

        .card-grid li a:hover img {
            filter: brightness(0) invert(1); /* Icono a blanco */
            transform: scale(1.1);
        }

        /* AJUSTE PARA MÓVILES */
        @media (max-width: 600px) {
            .card-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
            .card-grid li a {
                flex-direction: row;
                justify-content: flex-start;
                padding: 20px;
            }
            .card-grid li img {
                margin-bottom: 0;
                margin-right: 20px;
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="contenido">
        <h1>Congregación Punta Gorda</h1>

        <h2>Predicación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="predicacion.html">
                    <img src="images/noun_schedule_1776600.svg" alt="" />
                    <span>Grupos de predicación</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="territorios/mapa.html">
                    <img src="images/noun_map_10799.svg" alt="" />
                    <span>Mapa de territorios</span>
                </a>
            </li>
        </ul>

        <h2>Reuniones</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="vida-y-ministerio.html">
                    <img src="images/noun_teach_1614348.svg" alt="" />
                    <span>Reunión Vida y Ministerio</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="reunion-publica.html">
                    <img src="images/noun_conference_704693.svg" alt="" />
                    <span>Reunión Pública</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="limpieza.html">
                    <img src="images/noun_clean_1683608.svg" alt="" />
                    <span>Programa de Limpieza</span>
                </a>
            </li>
        </ul>

        <h2>Congregación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="publicadores.html">
                    <img src="images/noun_people_199910.svg" alt="" />
                    <span>Grupos de publicadores</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="precursores.html">
                    <img src="images/pioneers.svg" alt="" />
                    <span>Precursores regulares</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="responsabilidades.html">
                    <img src="images/noun_organization_421912.svg" alt="" />
                    <span>Responsabilidades</span>
                </a>
            </li>
        </ul>
    </div>

</body>
</html>
