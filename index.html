<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera Digital - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    <style>
        :root {
            --primary-blue: #1e3a5f;
            --soft-blue: #f0f4f8;
            --accent-gradient: linear-gradient(135deg, #2e5984 0%, #1e3a5f 100%);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #333;
            min-height: 100vh;
        }

        .contenido {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 0;
        }

        /* Título Innovador */
        .header {
            text-align: center;
            margin-bottom: 80px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            color: var(--primary-blue);
            letter-spacing: -2px;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 600;
        }

        h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #999;
            margin: 60px 0 30px;
            display: flex;
            align-items: center;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee;
            margin-left: 20px;
        }

        /* Grid Minimalista */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            list-style: none;
        }

        /* Tarjeta de Nueva Generación */
        .card-grid li a {
            display: flex;
            align-items: center;
            background: var(--soft-blue);
            padding: 40px 30px;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }

        .card-grid li a:hover {
            background: #ffffff;
            transform: scale(1.02);
            border-color: #ddd;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
        }

        /* Iconos con Micro-interacciones */
        .card-grid li img {
            width: 50px;
            height: 50px;
            margin-right: 25px;
            filter: grayscale(100%);
            opacity: 0.6;
            transition: all 0.4s ease;
        }

        .card-grid li a:hover img {
            filter: grayscale(0%);
            opacity: 1;
            transform: rotate(-5deg) scale(1.1);
        }

        /* Texto de Tarjeta */
        .card-grid li span {
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--primary-blue);
            transition: color 0.3s ease;
        }

        /* Efecto de fondo sutil al hover */
        .card-grid li a::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        /* Estilo para móviles */
        @media (max-width: 600px) {
            .contenido { padding: 40px 20px; }
            h1 { font-size: 2.2rem; }
            .card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="contenido">
        <div class="header">
            <h1>Congregación Punta Gorda</h1>
            <span class="tagline">Cartelera Digital</span>
        </div>

        <h2>Predicación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="predicacion.html">
                    <img src="images/noun_schedule_1776600.svg" alt="" />
                    <span>Grupos de predicación</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="territorios/mapa.html">
                    <img src="images/noun_map_10799.svg" alt="" />
                    <span>Mapa de territorios</span>
                </a>
            </li>
        </ul>

        <h2>Reuniones</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="vida-y-ministerio.html">
                    <img src="images/noun_teach_1614348.svg" alt="" />
                    <span>Vida y Ministerio</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="reunion-publica.html">
                    <img src="images/noun_conference_704693.svg" alt="" />
                    <span>Reunión Pública</span>
                </a>
            </li>
        </ul>
    </div>

</body>
</html>
