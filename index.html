<!DOCTYPE html>
<html lang="es">
<head>
    <title>Congregación Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap">
    <style>
        /* --- RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        .contenido {
            width: 95%;
            max-width: 1100px;
            margin: 50px auto;
            padding-bottom: 50px;
        }

        h1 {
            text-align: center;
            color: #4a148c; /* Morado JW */
            font-size: 2.8rem;
            margin-bottom: 60px;
            font-weight: 700;
        }

        h2 {
            font-size: 1.6rem;
            color: #444;
            margin: 40px 0 25px 10px;
            border-left: 6px solid #4a148c;
            padding-left: 15px;
        }

        /* --- GRID --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            list-style: none;
        }

        /* --- TARJETA --- */
        .card-grid li a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 45px 25px;
            text-decoration: none;
            border-radius: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid #fff;
            height: 220px; /* Altura fija para uniformidad */
        }

        /* HOVER: EL ALMA DEL DISEÑO */
        .card-grid li a:hover {
            transform: translateY(-12px);
            background-color: #4a148c;
            box-shadow: 0 20px 40px rgba(74, 20, 140, 0.25);
            border-color: #4a148c;
        }

        /* --- ICONOS --- */
        .card-grid li img {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            display: block;
        }

        /* --- TEXTO --- */
        .card-grid li span {
            font-weight: 700;
            font-size: 1.2rem;
            color: #FF5500; /* Naranja corporativo */
            transition: all 0.3s ease;
            text-align: center;
        }

        /* CAMBIOS AL PASAR EL MOUSE */
        .card-grid li a:hover span {
            color: #ffffff;
        }

        .card-grid li a:hover img {
            filter: brightness(0) invert(1); /* Icono pasa a blanco */
            transform: scale(1.1);
        }

        /* RESPONSIVO PARA MÓVILES */
        @media (max-width: 600px) {
            .contenido { margin: 20px auto; }
            h1 { font-size: 1.8rem; margin-bottom: 30px; }
            .card-grid { gap: 15px; }
            .card-grid li a {
                padding: 30px;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <div class="contenido">
        <h1>Congregación Punta Gorda</h1>

        <h2>Predicación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="predicacion.html">
                    <img src="images/noun_schedule_1776600.svg" alt="Calendario" />
                    <span>Grupos de predicación</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="territorios/mapa.html">
                    <img src="images/noun_map_10799.svg" alt="Mapa" />
                    <span>Mapa de territorios</span>
                </a>
            </li>
        </ul>

        <h2>Reuniones</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="vida-y-ministerio.html">
                    <img src="images/noun_teach_1614348.svg" alt="Reunión" />
                    <span>Reunión Vida y Ministerio</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="reunion-publica.html">
                    <img src="images/noun_conference_704693.svg" alt="Discurso" />
                    <span>Reunión Pública</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="limpieza.html">
                    <img src="images/noun_clean_1683608.svg" alt="Limpieza" />
                    <span>Programa de Limpieza</span>
                </a>
            </li>
        </ul>

        <h2>Congregación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="publicadores.html">
                    <img src="images/noun_people_199910.svg" alt="Publicadores" />
                    <span>Grupos de publicadores</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="precursores.html">
                    <img src="images/pioneers.svg" alt="Precursores" />
                    <span>Precursores regulares</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="responsabilidades.html">
                    <img src="images/noun_organization_421912.svg" alt="Responsabilidades" />
                    <span>Responsabilidades</span>
                </a>
            </li>
        </ul>
    </div>

</body>
</html>
