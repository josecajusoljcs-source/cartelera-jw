<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera Digital - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
    <style>
        :root {
            --azul-premium: #1e3a5f;
            --azul-claro: #f4f7fa;
            --sombra-suave: rgba(0, 0, 0, 0.04);
            --transicion: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #333;
            min-height: 100vh;
        }

        .contenido {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 0;
        }

        /* --- TÍTULO INNOVADOR --- */
        .header {
            text-align: center;
            margin-bottom: 80px;
        }

        .cartelera-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #bbb;
            font-weight: 700;
            display: block;
            margin-bottom: 10px;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 900;
            color: var(--azul-premium);
            letter-spacing: -2px;
            /* Efecto de máscara de texto sutil */
            background: linear-gradient(135deg, var(--azul-premium) 0%, #3498db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- SECCIONES --- */
        h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ccd6dd;
            margin: 60px 0 30px;
            display: flex;
            align-items: center;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #f0f0f0;
            margin-left: 20px;
        }

        /* --- GRID --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            list-style: none;
        }

        /* --- TARJETA INNOVADORA --- */
        .card-grid li a {
            display: flex;
            align-items: center;
            background: var(--azul-claro);
            padding: 40px 30px;
            text-decoration: none;
            border-radius: 28px;
            transition: var(--transicion);
            border: 1px solid transparent;
            position: relative;
        }

        /* Efecto de elevación y cambio de color al pasar el mouse */
        .card-grid li a:hover {
            background: #ffffff;
            transform: scale(1.03);
            border-color: #e2e8f0;
            box-shadow: 0 30px 60px rgba(30, 58, 95, 0.08);
        }

        /* --- ICONOS DINÁMICOS --- */
        .card-grid li img {
            width: 50px;
            height: 50px;
            margin-right: 25px;
            /* Empiezan en gris sutil */
            filter: grayscale(1) opacity(0.4);
            transition: var(--transicion);
        }

        .card-grid li a:hover img {
            filter: grayscale(0) opacity(1);
            transform: scale(1.15) rotate(-3deg);
        }

        /* --- TEXTO --- */
        .card-grid li span {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--azul-premium);
            transition: var(--transicion);
        }

        /* AJUSTE PARA MÓVILES */
        @media (max-width: 600px) {
            .contenido { padding: 40px 20px; }
            h1 { font-size: 2.2rem; }
            .card-grid { grid-template-columns: 1fr; }
            .card-grid li a { padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="contenido">
        <div class="header">
            <span class="cartelera-label">CARTELERA DIGITAL</span>
            <h1>Congregación Punta Gorda</h1>
        </div>

        <h2>Predicación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="predicacion.html">
                    <img src="images/noun_schedule_1776600.svg" alt="" />
                    <span>Grupos de predicación</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="territorios/mapa.html">
                    <img src="images/noun_map_10799.svg" alt="" />
                    <span>Mapa de territorios</span>
                </a>
            </li>
        </ul>

        <h2>Reuniones</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="vida-y-ministerio.html">
                    <img src="images/noun_teach_1614348.svg" alt="" />
                    <span>Vida y Ministerio</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="reunion-publica.html">
                    <img src="images/noun_conference_704693.svg" alt="" />
                    <span>Reunión Pública</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="limpieza.html">
                    <img src="images/noun_clean_1683608.svg" alt="" />
                    <span>Programa de Limpieza</span>
                </a>
            </li>
        </ul>

        <h2>Congregación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="publicadores.html">
                    <img src="images/noun_people_199910.svg" alt="" />
                    <span>Grupos de publicadores</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="precursores.html">
                    <img src="images/pioneers.svg" alt="" />
                    <span>Precursores regulares</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="responsabilidades.html">
                    <img src="images/noun_organization_421912.svg" alt="" />
                    <span>Responsabilidades</span>
                </a>
            </li>
        </ul>
    </div>

</body>
</html>
