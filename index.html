<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera Digital - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
    <style>
        :root {
            --azul-premium: #1e3a5f;
            --bg-page: #f4f7fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: #1a1a1a;
            padding-bottom: 50px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(90deg, #004e92, #d4145a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 5px;
        }

        section { margin-bottom: 25px; }

        h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 15px;
            padding-left: 5px;
        }

        /* --- ESTILO DE TARJETAS TIPO JW.ORG --- */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .image-card {
            position: relative;
            display: block;
            width: 100%;
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        .image-card:active { transform: scale(0.98); }

        .card-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }

        /* Capa oscura para que el texto se lea bien */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.2) 60%);
        }

        .card-title {
            position: absolute;
            bottom: 15px;
            left: 20px;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        @media (min-width: 768px) {
            .container { max-width: 900px; }
            .grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span style="font-size: 0.7rem; letter-spacing: 3px; color: #8899a6; text-transform: uppercase;">Cartelera Digital</span>
            <h1>Congregación Punta Gorda</h1>
        </header>

        <section>
            <h2>Predicación</h2>
            <div class="grid">
                <a href="predicacion.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1516733729417-3073040c5e94?auto=format&fit=crop&w=600&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Grupos de predicación</span>
                </a>
                <a href="territorios/mapa.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=600&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Mapa de territorios</span>
                </a>
            </div>
        </section>

        <section>
            <h2>Reuniones</h2>
            <div class="grid">
                <a href="vida-y-ministerio.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1505664194779-8beaceb93744?auto=format&fit=crop&w=600&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Vida y Ministerio</span>
                </a>
                <a target="_blank" href="https://josecajusoljcs-source.github.io/cartelera/" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1478737270239-2f02b77fc618?auto=format&fit=crop&w=600&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Asignación Audio y Video</span>
                </a>
            </div>
        </section>

        <section>
            <h2>Congregación</h2>
            <div class="grid">
                <a href="limpieza.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=600&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Programa de Limpieza</span>
                </a>
                <a href="publicadores.html" class="image-card">
                    <div class="image-bg" style="background-image: url('https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=600&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Grupos de publicadores</span>
                </a>
            </div>
        </section>
    </div>

</body>
</html>
