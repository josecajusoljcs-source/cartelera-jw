<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera Espacial - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap">
    <style>
        /* --- ESTILO NASA / JW VIBRANTE --- */
        :root {
            --neon-cyan: #00e5ff;
            --jw-purple: #4a148c;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            /* Fondo Galáctico Animado */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #4a148c);
            background-size: 400% 400%;
            animation: nebula 15s ease infinite;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes nebula {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container-nasa {
            width: 95%;
            max-width: 1200px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 70px;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.5));
        }

        h2 {
            color: var(--neon-cyan);
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 50px 0 25px;
            display: flex;
            align-items: center;
        }

        h2::after {
            content: "";
            height: 1px;
            flex: 1;
            background: linear-gradient(to right, var(--neon-cyan), transparent);
            margin-left: 20px;
            opacity: 0.5;
        }

        /* --- GRID DE CRISTAL --- */
        .grid-espacial {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            list-style: none;
        }

        /* --- TARJETA DE CRISTAL (GLASSMORPHISM) --- */
        .grid-espacial li a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 50px 20px;
            text-decoration: none;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            height: 240px;
        }

        /* Efecto de brillo al pasar el mouse */
        .grid-espacial li a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-15px) scale(1.02);
            border-color: var(--neon-cyan);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 229, 255, 0.2);
        }

        /* --- ICONOS VIVOS --- */
        .grid-espacial li img {
            width: 80px;
            height: 80px;
            margin-bottom: 25px;
            /* Los volvemos blancos con brillo neón */
            filter: invert(1) brightness(2) drop-shadow(0 0 10px rgba(255,255,255,0.5));
            transition: all 0.4s ease;
        }

        .grid-espacial li a:hover img {
            transform: scale(1.1) rotate(3deg);
            filter: invert(1) brightness(3) drop-shadow(0 0 15px var(--neon-cyan));
        }

        /* --- TEXTO --- */
        .grid-espacial li span {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.25rem;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Animación de entrada para las tarjetas */
        .grid-espacial li {
            animation: fadeIn 0.8s ease backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Retraso para cada tarjeta */
        .grid-espacial li:nth-child(1) { animation-delay: 0.1s; }
        .grid-espacial li:nth-child(2) { animation-delay: 0.2s; }
        .grid-espacial li:nth-child(3) { animation-delay: 0.3s; }

        /* MÓVIL */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .grid-espacial { grid-template-columns: 1fr; }
            .grid-espacial li a { height: auto; padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <div class="container-nasa">
        <h1>Congregación Punta Gorda</h1>

        <h2>Predicación</h2>
        <ul class="grid-espacial">
            <li>
                <a target="_blank" href="predicacion.html">
                    <img src="images/noun_schedule_1776600.svg" alt="Calendario" />
                    <span>Grupos de predicación</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="territorios/mapa.html">
                    <img src="images/noun_map_10799.svg" alt="Mapa" />
                    <span>Mapa de territorios</span>
                </a>
            </li>
        </ul>

        <h2>Reuniones</h2>
        <ul class="grid-espacial">
            <li>
                <a target="_blank" href="vida-y-ministerio.html">
                    <img src="images/noun_teach_1614348.svg" alt="Reunión" />
                    <span>Reunión Vida y Ministerio</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="reunion-publica.html">
                    <img src="images/noun_conference_704693.svg" alt="Pública" />
                    <span>Reunión Pública</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="limpieza.html">
                    <img src="images/noun_clean_1683608.svg" alt="Limpieza" />
                    <span>Programa de Limpieza</span>
                </a>
            </li>
        </ul>

        <h2>Congregación</h2>
        <ul class="grid-espacial">
            <li>
                <a target="_blank" href="publicadores.html">
                    <img src="images/noun_people_199910.svg" alt="Gente" />
                    <span>Grupos de publicadores</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="precursores.html">
                    <img src="images/pioneers.svg" alt="Precursores" />
                    <span>Precursores regulares</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="responsabilidades.html">
                    <img src="images/noun_organization_421912.svg" alt="Admin" />
                    <span>Responsabilidades</span>
                </a>
            </li>
        </ul>
    </div>

</body>
</html>
