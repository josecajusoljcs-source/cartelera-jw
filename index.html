<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera Digital - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
    <style>
        /* --- COLORES EXACTOS DE LA IMAGEN --- */
        :root {
            --azul-titulo: #1e3a5f;
            --gris-label: #8899a6;
            --bg-page: #fdf2e9; /* Fondo crema suave como la imagen */
            /* Degradados de las tarjetas */
            --grad-predicacion: linear-gradient(90deg, #3858a8 0%, #f9d5cc 100%);
            --grad-territorios: linear-gradient(90deg, #9b6ab3 0%, #d1f3e1 100%);
            --grad-reuniones: linear-gradient(90deg, #d3b1d9 0%, #fbd9c8 100%);
            --grad-publica: linear-gradient(90deg, #b79edb 0%, #d3f3e6 100%);
            --grad-audio: linear-gradient(90deg, #2c52a0 0%, #d5f2e0 100%);
            --grad-limpieza: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: #333;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 30px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .cartelera-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--gris-label);
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--azul-titulo);
            letter-spacing: -1px;
        }

        h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gris-label);
            margin: 30px 0 15px;
            display: flex;
            align-items: center;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(0,0,0,0.1);
            margin-left: 15px;
        }

        /* --- LAS TARJETAS (CARDS) --- */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .action-card {
            display: flex;
            align-items: center;
            padding: 15px;
            text-decoration: none;
            border-radius: 20px;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .action-card:active { transform: scale(0.97); }

        /* Asignación de degradados específicos */
        .c-pred { background: var(--grad-predicacion); }
        .c-terr { background: var(--grad-territorios); }
        .c-reun { background: var(--grad-reuniones); }
        .c-publ { background: var(--grad-publica); }
        .c-audi { background: var(--grad-audio); }
        .c-limp { background: var(--grad-limpieza); }

        .icon-box {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            backdrop-filter: blur(5px);
        }

        .action-card img {
            width: 26px;
            height: 26px;
            filter: brightness(0) invert(1); /* Iconos blancos como la imagen */
        }

        .action-card span {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--azul-titulo);
        }

        /* Responsivo para PC */
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .container { max-width: 1000px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span class="cartelera-label">Cartelera Digital</span>
            <h1>Congregación Punta Gorda</h1>
        </header>

        <section>
            <h2>Predicación</h2>
            <div class="grid">
                <a href="predicacion.html" class="action-card c-pred">
                    <div class="icon-box"><img src="images/noun_schedule_1776600.svg"></div>
                    <span>Grupos de predicación</span>
                </a>
                <a href="territorios/mapa.html" class="action-card c-terr">
                    <div class="icon-box"><img src="images/noun_map_10799.svg"></div>
                    <span>Mapa de territorios</span>
                </a>
            </div>
        </section>

        <section>
            <h2>Reuniones</h2>
            <div class="grid">
                <a href="vida-y-ministerio.html" class="action-card c-reun">
                    <div class="icon-box"><img src="images/noun_teach_1614348.svg"></div>
                    <span>Vida y Ministerio</span>
                </a>
                <a href="reunion-publica.html" class="action-card c-publ">
                    <div class="icon-box"><img src="images/noun_conference_704693.svg"></div>
                    <span>Reunión Pública</span>
                </a>
                <a target="_blank" href="https://josecajusoljcs-source.github.io/cartelera/" class="action-card c-audi">
                    <div class="icon-box"><img src="images/noun_organization_421912.svg"></div>
                    <span>Asignación Audio y Video</span>
                </a>
            </div>
        </section>

        <section>
            <h2>Congregación</h2>
            <div class="grid">
                <a href="limpieza.html" class="action-card c-limp">
                    <div class="icon-box"><img src="images/noun_clean_1683608.svg"></div>
                    <span>Programa de Limpieza</span>
                </a>
                <a href="publicadores.html" class="action-card c-reun">
                    <div class="icon-box"><img src="images/noun_people_199910.svg"></div>
                    <span>Grupos de publicadores</span>
                </a>
                <a href="precursores.html" class="action-card c-publ">
                    <div class="icon-box"><img src="images/pioneers.svg"></div>
                    <span>Precursores regulares</span>
                </a>
                <a href="responsabilidades.html" class="action-card c-terr">
                    <div class="icon-box"><img src="images/noun_organization_421912.svg"></div>
                    <span>Responsabilidades</span>
                </a>
            </div>
        </section>
    </div>

</body>
</html>
