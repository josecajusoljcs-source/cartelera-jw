<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera Digital - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
    <style>
        :root {
            /* Degradado azul elegante y sobrio */
            --bg-gradient: linear-gradient(180deg, #dce8f2 0%, #f4f7fa 100%);
            --azul-premium: #1e3a5f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #1a1a1a;
            padding-bottom: 60px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--azul-premium);
            letter-spacing: -1.5px;
            margin-top: 10px;
        }

        section { margin-bottom: 35px; }

        h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #546e7a;
            margin-bottom: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(30, 58, 95, 0.1);
            margin-left: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .image-card {
            position: relative;
            display: block;
            width: 100%;
            height: 170px;
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(30, 58, 95, 0.15);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .image-card:active { transform: scale(0.97); }

        .card-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(30, 58, 95, 0.9) 0%, rgba(30, 58, 95, 0.2) 70%);
        }

        .card-title {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        @media (min-width: 768px) {
            .container { max-width: 950px; }
            .grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span style="font-size: 0.75rem; letter-spacing: 4px; color: #546e7a; text-transform: uppercase; font-weight: 700;">Cartelera Digital</span>
            <h1>Congregación Punta Gorda</h1>
        </header>

        <section>
            <h2>Predicación</h2>
            <div class="grid">
                <a href="predicacion.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1516733729417-3073040c5e94?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Grupos de predicación</span>
                </a>
                <a href="territorios/mapa.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Mapa de territorios</span>
                </a>
            </div>
        </section>

        <section>
            <h2>Reuniones</h2>
            <div class="grid">
                <a href="vida-y-ministerio.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1505664194779-8beaceb93744?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Vida y Ministerio</span>
                </a>
                <a href="reunion-publica.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1507434965515-61970f2bd7c6?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Reunión Pública</span>
                </a>
                <a target="_blank" href="https://josecajusoljcs-source.github.io/cartelera/" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Asignación Audio y Video</span>
                </a>
            </div>
        </section>

        <section>
            <h2>Congregación</h2>
            <div class="grid">
                <a href="limpieza.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1584622781564-1d987f7333c1?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Programa de Limpieza</span>
                </a>
                <a href="publicadores.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Grupos de publicadores</span>
                </a>
                <a href="precursores.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Precursores regulares</span>
                </a>
                <a href="responsabilidades.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1454165833767-027ffea7028c?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Responsabilidades</span>
                </a>
            </div>
        </section>
    </div>

</body>
</html>
