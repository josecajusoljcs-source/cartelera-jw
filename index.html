<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera Digital - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
    <style>
        :root {
            /* Degradado azul más definido pero elegante */
            --bg-gradient: linear-gradient(180deg, #cfddec 0%, #eef2f7 100%);
            --azul-premium: #1e3a5f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #1a1a1a;
            padding-bottom: 60px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--azul-premium);
            letter-spacing: -1px;
        }

        section { margin-bottom: 35px; }

        h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #455a64;
            margin-bottom: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(30, 58, 95, 0.2);
            margin-left: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .image-card {
            position: relative;
            display: block;
            width: 100%;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(30, 58, 95, 0.15);
            transition: transform 0.2s ease;
        }

        .image-card:active { transform: scale(0.98); }

        .card-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(30, 58, 95, 0.8) 0%, rgba(30, 58, 95, 0.1) 60%);
        }

        .card-title {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        @media (min-width: 768px) {
            .container { max-width: 950px; }
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span style="font-size: 0.7rem; letter-spacing: 4px; color: #546e7a; text-transform: uppercase; font-weight: 700;">Cartelera Digital</span>
            <h1>Congregación Punta Gorda</h1>
        </header>

        <section>
            <h2>Predicación</h2>
            <div class="grid">
                <a href="predicacion.html" class="image-card">
                    <div class="card-bg" style="background-image: url('image_897cd8.jpg');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Grupos de predicación</span>
                </a>
                <a href="territorios/mapa.html" class="image-card">
                    <div class="card-bg" style="background-image: url('image_88a31d.jpg');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Mapa de territorios</span>
                </a>
            </div>
        </section>

        <section>
            <h2>Reuniones</h2>
            <div class="grid">
                <a href="vida-y-ministerio.html" class="image-card">
                    <div class="card-bg" style="background-image: url('image_898834.jpg');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Vida y Ministerio</span>
                </a>
                <a href="reunion-publica.html" class="image-card">
                    <div class="card-bg" style="background-image: url('image_898c13.jpg');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Reunión Pública</span>
                </a>
                <a target="_blank" href="https://josecajusoljcs-source.github.io/cartelera/" class="image-card">
                    <div class="card-bg" style="background-image: url('image_89e5b6.jpg');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Asignación Audio y Video</span>
                </a>
            </div>
        </section>

        <section>
            <h2>Congregación</h2>
            <div class="grid">
                <a href="limpieza.html" class="image-card">
                    <div class="card-bg" style="background-image: url('image_8992a3.jpg');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Programa de Limpieza</span>
                </a>
                <a href="publicadores.html" class="image-card">
                    <div class="card-bg" style="background-image: url('image_89e975.jpg');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Grupos de publicadores</span>
                </a>
                <a href="precursores.html" class="image-card">
                    <div class="card-bg" style="background-image: url('image_89e975.jpg');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Precursores regulares</span>
                </a>
                <a href="responsabilidades.html" class="image-card">
                    <div class="card-bg" style="background-image: url('image_93f4c5.jpg');"></div>
                    <div class="overlay"></div>
                    <span class="card-title">Responsabilidades</span>
                </a>
            </div>
        </section>
    </div>

</body>
</html>
