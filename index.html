<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera Digital - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap">
    <style>
        /* --- ESTILO "ESPACIAL" JW --- */
        :root {
            --jw-purple: #4a148c;
            --jw-light-purple: #7b1fa2;
            --vibrant-cyan: #00e5ff;
            --glass: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            /* Fondo con degradado animado "Nasa Style" */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .contenido {
            width: 95%;
            max-width: 1200px;
            padding: 50px 15px;
        }

        h1 {
            text-align: center;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            background: linear-gradient(to right, #fff, var(--vibrant-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 60px;
            filter: drop-shadow(0 5px 15px rgba(0,229,255,0.4));
        }

        h2 {
            font-size: 1.5rem;
            margin: 40px 0 20px;
            color: var(--vibrant-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
        }

        h2::after {
            content: "";
            height: 1px;
            flex: 1;
            background: linear-gradient(to right, var(--vibrant-cyan), transparent);
            margin-left: 20px;
        }

        /* --- GRID DE CRISTAL --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            list-style: none;
        }

        /* --- TARJETA GLASSMORPHISM --- */
        .card-grid li a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--glass);
            backdrop-filter: blur(10px); /* Efecto borroso */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 20px;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 220px;
        }

        .card-grid li a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05) translateY(-10px);
            border-color: var(--vibrant-cyan);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* --- ICONOS Y TEXTO --- */
        .card-grid li img {
            width: 75px;
            height: 75px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
            transition: transform 0.3s ease;
        }

        .card-grid li a:hover img {
            transform: rotate(5deg) scale(1.1);
        }

        .card-grid li span {
            color: #fff;
            font-weight: 700;
            font-size: 1.15rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* EFECTO DE LUZ AL HOVER */
        .card-grid li a::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .card-grid li a:hover::before {
            left: 100%;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .card-grid li a { height: auto; padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="contenido">
        <h1>Congregación Punta Gorda</h1>

        <h2>Predicación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="predicacion.html">
                    <img src="images/noun_schedule_1776600.svg" alt="" style="filter: invert(1) brightness(2);" />
                    <span>Grupos de predicación</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="territorios/mapa.html">
                    <img src="images/noun_map_10799.svg" alt="" style="filter: invert(1) brightness(2);" />
                    <span>Mapa de territorios</span>
                </a>
            </li>
        </ul>

        <h2>Reuniones</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="vida-y-ministerio.html">
                    <img src="images/noun_teach_1614348.svg" alt="" style="filter: invert(1) brightness(2);" />
                    <span>Reunión Vida y Ministerio</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="reunion-publica.html">
                    <img src="images/noun_conference_704693.svg" alt="" style="filter: invert(1) brightness(2);" />
                    <span>Reunión Pública</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="limpieza.html">
                    <img src="images/noun_clean_1683608.svg" alt="" style="filter: invert(1) brightness(2);" />
                    <span>Programa de Limpieza</span>
                </a>
            </li>
        </ul>

        <h2>Congregación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="publicadores.html">
                    <img src="images/noun_people_199910.svg" alt="" style="filter: invert(1) brightness(2);" />
                    <span>Grupos de publicadores</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="precursores.html">
                    <img src="images/pioneers.svg" alt="" style="filter: invert(1) brightness(2);" />
                    <span>Precursores regulares</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="responsabilidades.html">
                    <img src="images/noun_organization_421912.svg" alt="" style="filter: invert(1) brightness(2);" />
                    <span>Responsabilidades</span>
                </a>
            </li>
        </ul>
    </div>

</body>
</html>
