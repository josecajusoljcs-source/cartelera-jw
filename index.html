<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera Digital - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    <style>
        :root {
            --primary-blue: #1e3a5f;
            --soft-blue: #f0f4f8;
            --accent-gradient: linear-gradient(135deg, #2e5984 0%, #1e3a5f 100%);
            --bg-body: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: #333;
            min-height: 100vh;
        }

        .contenido {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 0;
        }

        /* --- CABECERA --- */
        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .cartelera-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #aaa;
            font-weight: 800;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            color: var(--primary-blue);
            letter-spacing: -1.5px;
        }

        /* --- SECCIONES --- */
        h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #bbb;
            margin: 50px 0 25px;
            display: flex;
            align-items: center;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee;
            margin-left: 20px;
        }

        /* --- GRID --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            list-style: none;
        }

        /* --- TARJETAS --- */
        .card-grid li a {
            display: flex;
            align-items: center;
            background: var(--soft-blue);
            padding: 35px 30px;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            border: 1px solid transparent;
        }

        .card-grid li a:hover {
            background: #ffffff;
            transform: translateY(-5px);
            border-color: #ddd;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        /* --- ICONOS --- */
        .card-grid li img {
            width: 45px;
            height: 45px;
            margin-right: 25px;
            filter: grayscale(100%);
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .card-grid li a:hover img {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.1);
        }

        /* --- TEXTO --- */
        .card-grid li span {
            font-weight: 600;
            font-size: 1.15rem;
            color: var(--primary-blue);
        }

        /* AJUSTE MÓVIL */
        @media (max-width: 600px) {
            .card-grid { grid-template-columns: 1fr; }
            .card-grid li a { padding: 25px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="contenido">
        <div class="header">
            <span class="cartelera-label">Cartelera Digital</span>
            <h1>Congregación Punta Gorda</h1>
        </div>

        <h2>Predicación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="predicacion.html">
                    <img src="images/noun_schedule_1776600.svg" alt="" />
                    <span>Grupos de predicación</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="territorios/mapa.html">
                    <img src="images/noun_map_10799.svg" alt="" />
                    <span>Mapa de territorios</span>
                </a>
            </li>
        </ul>

        <h2>Reuniones</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="vida-y-ministerio.html">
                    <img src="images/noun_teach_1614348.svg" alt="" />
                    <span>Vida y Ministerio</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="reunion-publica.html">
                    <img src="images/noun_conference_704693.svg" alt="" />
                    <span>Reunión Pública</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="limpieza.html">
                    <img src="images/noun_clean_1683608.svg" alt="" />
                    <span>Programa de Limpieza</span>
                </a>
            </li>
        </ul>

        <h2>Congregación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="publicadores.html">
                    <img src="images/noun_people_199910.svg" alt="" />
                    <span>Grupos de publicadores</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="precursores.html">
                    <img src="images/pioneers.svg" alt="" />
                    <span>Precursores regulares</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="responsabilidades.html">
                    <img src="images/noun_organization_421912.svg" alt="" />
                    <span>Responsabilidades</span>
                </a>
            </li>
        </ul>
    </div>

</body>
</html>
