<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera Digital - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
    <style>
        :root {
            /* Degradado premium similar al de Audio y Video */
            --bg-gradient: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            --azul-jw: #1e3a5f;
            --dorado: #facc15;
            --text-color: #f9fafb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            padding-bottom: 60px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .pill-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 15px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 999px;
            font-size: 0.75rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .pill-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; box-shadow: 0 0 10px #22c55e;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        section { margin-bottom: 40px; }

        h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent, #38bdf8);
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .image-card {
            position: relative;
            display: block;
            width: 100%;
            height: 160px;
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }

        .image-card:active { transform: scale(0.97); }

        .card-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }

        .image-card:hover .card-bg { transform: scale(1.05); }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Degradado para que el texto se vea bien */
            background: linear-gradient(to top, rgba(2, 6, 23, 0.9) 0%, rgba(2, 6, 23, 0.2) 70%);
        }

        .card-content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
        }

        .card-title {
            display: block;
            color: var(--dorado);
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .card-subtitle {
            display: block;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.9;
        }

        /* Ajuste para pantallas más grandes */
        @media (min-width: 600px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .image-card { height: 180px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="pill-status">
                <span class="pill-dot"></span>
                <span>Cartelera Punta Gorda</span>
            </div>
            <h1>Congregación Punta Gorda</h1>
        </header>

        <section>
            <h2>Predicación</h2>
            <div class="grid">
                <a href="predicacion.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://assets.jw.org/images/es/noticias/region/peru/Campañade-predicación-durante-los-Juegos-Panamericanos-de-Perú/Campañade-predicación-durante-los-Juegos-Panamericanos-de-Perú_02.jpg');"></div>
                    <div class="overlay"></div>
                    <div class="card-content">
                        <span class="card-title">Predicación</span>
                        <span class="card-subtitle">Grupos y salidas</span>
                    </div>
                </a>
                <a href="territorios/mapa.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://assets.jw.org/images/es/noticias/region/corea-del-sur/El-tribunal-constitucional-de-Corea-del-Sur-reconoce-el-derecho-a-la-objecion-de-conciencia/El-tribunal-constitucional-de-Corea-del-Sur-reconoce-el-derecho-a-la-objecion-de-conciencia_01.jpg');"></div>
                    <div class="overlay"></div>
                    <div class="card-content">
                        <span class="card-title">Territorios</span>
                        <span class="card-subtitle">Mapas de la zona</span>
                    </div>
                </a>
            </div>
        </section>

        <section>
            <h2>Reuniones</h2>
            <div class="grid">
                <a href="vida-y-ministerio.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://assets.jw.org/images/es/preguntas-frecuentes/organizacion-congregaciones/organizacion-congregaciones_02.jpg');"></div>
                    <div class="overlay"></div>
                    <div class="card-content">
                        <span class="card-title">Vida y Ministerio</span>
                        <span class="card-subtitle">Asignaciones de entre semana</span>
                    </div>
                </a>
                <a target="_blank" href="https://josecajusoljcs-source.github.io/cartelera/" class="image-card">
                    <div class="card-bg" style="background-image: url('https://cms-img.jw-cdn.org/img/p/502500226/univ/art/502500226_univ_lsr_xl.jpg');"></div>
                    <div class="overlay"></div>
                    <div class="card-content">
                        <span class="card-title">Audio y Video</span>
                        <span class="card-subtitle">Consultar recordatorios</span>
                    </div>
                </a>
            </div>
        </section>

        <section>
            <h2>Congregación</h2>
            <div class="grid">
                <a href="limpieza.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://cms-img.jw-cdn.org/img/p/502500220/univ/art/502500220_univ_cnt_5_xl.jpg');"></div>
                    <div class="overlay"></div>
                    <div class="card-content">
                        <span class="card-title">Limpieza</span>
                        <span class="card-subtitle">Programa del Salón</span>
                    </div>
                </a>
                <a href="publicadores.html" class="image-card">
                    <div class="card-bg" style="background-image: url('https://assets.jw.org/images/es/preguntas-frecuentes/organizacion-congregaciones/organizacion-congregaciones_01.jpg');"></div>
                    <div class="overlay"></div>
                    <div class="card-content">
                        <span class="card-title">Publicadores</span>
                        <span class="card-subtitle">Grupos de servicio</span>
                    </div>
                </a>
            </div>
        </section>
    </div>

</body>
</html>
