<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera Digital - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
    <style>
        :root {
            --azul-premium: #1e3a5f;
            --azul-claro: #f4f7fa;
            --text-secundario: #8899a6;
            --transicion: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 15px 50px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .label-digital {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-secundario);
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--azul-premium);
            letter-spacing: -1px;
        }

        section {
            margin-bottom: 35px;
        }

        h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secundario);
            margin-bottom: 15px;
            padding-left: 5px;
            display: flex;
            align-items: center;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #f0f0f0;
            margin-left: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .action-card {
            display: flex;
            align-items: center;
            background: var(--azul-claro);
            padding: 20px;
            text-decoration: none;
            border-radius: 20px;
            transition: var(--transicion);
            border: 1px solid transparent;
        }

        .action-card:active, .action-card:hover {
            background: #ffffff;
            transform: scale(0.98);
            border-color: #d1d9e6;
            box-shadow: 0 10px 25px rgba(30, 58, 95, 0.08);
        }

        .icon-box {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 14px;
            margin-right: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .action-card img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .action-card span {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--azul-premium);
        }

        @media (min-width: 768px) {
            .container { max-width: 1000px; }
            .grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span class="label-digital">Cartelera Digital</span>
            <h1>Congregación Punta Gorda</h1>
        </header>

        <section>
            <h2>Predicación</h2>
            <div class="grid">
                <a href="predicacion.html" class="action-card">
                    <div class="icon-box"><img src="images/noun_schedule_1776600.svg" alt=""></div>
                    <span>Grupos de predicación</span>
                </a>
                <a href="territorios/mapa.html" class="action-card">
                    <div class="icon-box"><img src="images/noun_map_10799.svg" alt=""></div>
                    <span>Mapa de territorios</span>
                </a>
            </div>
        </section>

        <section>
            <h2>Reuniones</h2>
            <div class="grid">
                <a href="vida-y-ministerio.html" class="action-card">
                    <div class="icon-box"><img src="images/noun_teach_1614348.svg" alt=""></div>
                    <span>Vida y Ministerio</span>
                </a>
                <a href="reunion-publica.html" class="action-card">
                    <div class="icon-box"><img src="images/noun_conference_704693.svg" alt=""></div>
                    <span>Reunión Pública</span>
                </a>
                <a target="_blank" href="https://josecajusoljcs-source.github.io/cartelera/" class="action-card">
                    <div class="icon-box"><img src="images/noun_organization_421912.svg" alt=""></div>
                    <span>Otras Carteleras</span>
                </a>
            </div>
        </section>

        <section>
            <h2>Congregación</h2>
            <div class="grid">
                <a href="limpieza.html" class="action-card">
                    <div class="icon-box"><img src="images/noun_clean_1683608.svg" alt=""></div>
                    <span>Programa de Limpieza</span>
                </a>
                <a href="publicadores.html" class="action-card">
                    <div class="icon-box"><img src="images/noun_people_199910.svg" alt=""></div>
                    <span>Grupos de publicadores</span>
                </a>
                <a href="precursores.html" class="action-card">
                    <div class="icon-box"><img src="images/pioneers.svg" alt=""></div>
                    <span>Precursores regulares</span>
                </a>
                <a href="responsabilidades.html" class="action-card">
                    <div class="icon-box"><img src="images/noun_organization_421912.svg" alt=""></div>
                    <span>Responsabilidades</span>
                </a>
            </div>
        </section>
    </div>

</body>
</html>
