<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cartelera - Punta Gorda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
    <style>
        :root {
            /* Azul profesional y suave */
            --azul-jw: #2e5984;
            --azul-oscuro: #1a3a5f;
            /* Fondo degradado suave (Estilo Parque Rivera) */
            --bg-color: linear-gradient(135deg, #eef2f3 0%, #d5dde5 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-color);
            background-attachment: fixed;
            color: #444;
            min-height: 100vh;
        }

        .contenido {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 0;
        }

        /* --- TÍTULO AZUL REFINADO --- */
        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            font-weight: 700;
            color: var(--azul-oscuro);
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }

        .sub-titulo {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #777;
            font-weight: 400;
        }

        h2 {
            font-size: 1.25rem;
            margin: 40px 0 25px 10px;
            color: var(--azul-jw);
            display: flex;
            align-items: center;
            font-weight: 600;
        }

        h2::before {
            content: "";
            width: 5px;
            height: 22px;
            background: var(--azul-jw);
            margin-right: 15px;
            border-radius: 10px;
        }

        /* --- GRID DE TARJETAS --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            list-style: none;
        }

        /* --- TARJETA CON SOMBRA Y COLOR --- */
        .card-grid li a {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9); /* Un toque de transparencia */
            padding: 30px;
            text-decoration: none;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.6);
            
            /* Sombra inicial suave */
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            
            /* Transición fluida para la sombra y el movimiento */
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            will-change: transform, box-shadow;
        }

        /* EFECTO HOVER (Sombra Linda y Color) */
        .card-grid li a:hover {
            transform: translateY(-6px);
            background: #ffffff;
            /* Sombra más profunda y azulada al pasar el mouse */
            box-shadow: 0 20px 35px rgba(26, 58, 95, 0.12);
            border-color: var(--azul-jw);
        }

        /* --- ICONOS Y TEXTO --- */
        .card-grid li img {
            width: 55px;
            height: 55px;
            margin-right: 25px;
            transition: transform 0.3s ease;
        }

        .card-grid li a:hover img {
            transform: scale(1.1);
        }

        .card-grid li span {
            font-weight: 600;
            font-size: 1.1rem;
            color: #4a4a4a;
            transition: color 0.3s ease;
        }

        .card-grid li a:hover span {
            color: var(--azul-oscuro);
        }

        /* MÓVIL */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .card-grid { grid-template-columns: 1fr; }
            .card-grid li a { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="contenido">
        <div class="header">
            <h1>Congregación Punta Gorda</h1>
            <span class="sub-titulo">Cartelera de Información</span>
        </div>

        <h2>Predicación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="predicacion.html">
                    <img src="images/noun_schedule_1776600.svg" alt="" />
                    <span>Grupos de predicación</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="territorios/mapa.html">
                    <img src="images/noun_map_10799.svg" alt="" />
                    <span>Mapa de territorios</span>
                </a>
            </li>
        </ul>

        <h2>Reuniones</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="vida-y-ministerio.html">
                    <img src="images/noun_teach_1614348.svg" alt="" />
                    <span>Vida y Ministerio</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="reunion-publica.html">
                    <img src="images/noun_conference_704693.svg" alt="" />
                    <span>Reunión Pública</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="limpieza.html">
                    <img src="images/noun_clean_1683608.svg" alt="" />
                    <span>Programa de Limpieza</span>
                </a>
            </li>
        </ul>

        <h2>Congregación</h2>
        <ul class="card-grid">
            <li>
                <a target="_blank" href="publicadores.html">
                    <img src="images/noun_people_199910.svg" alt="" />
                    <span>Grupos de publicadores</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="precursores.html">
                    <img src="images/pioneers.svg" alt="" />
                    <span>Precursores regulares</span>
                </a>
            </li>
            <li>
                <a target="_blank" href="responsabilidades.html">
                    <img src="images/noun_organization_421912.svg" alt="" />
                    <span>Responsabilidades</span>
                </a>
            </li>
        </ul>
    </div>

</body>
</html>
