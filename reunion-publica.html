<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reunión Pública</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f4ef;
      --text:#171717;
      --muted:#6f6f6f;
      --line:rgba(0,0,0,.10);

      --jw-beige:#efe0a1;
      --jw-blue:#5f6f86;
      --jw-blue-soft:#e8edf3;
      --jw-wine:#8c1d40;

      --shadow-card:0 6px 16px rgba(0,0,0,.04);
      --radius-xl:18px;
      --radius-lg:14px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:"Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body{
      width:100%;
      max-width:100%;
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
      background:
        linear-gradient(180deg, rgba(239,224,161,.22), transparent 150px),
        linear-gradient(180deg, #fbfaf6, var(--bg));
      color:var(--text);
      padding:1rem;
      display:flex;
      justify-content:center;
    }

    .page{
      width:100%;
      max-width:980px;
      margin:0 auto;
    }

    header{
      text-align:center;
      margin-bottom:1rem;
      padding-top:.3rem;
    }

    header h1{
      font-size:clamp(1.8rem, 4.8vw, 2.4rem);
      line-height:1.12;
      font-weight:800;
      letter-spacing:-.02em;
      color:#111;
      margin-bottom:.18rem;
    }

    .subhead{
      color:var(--muted);
      font-size:.95rem;
    }

    .shell{
      background:linear-gradient(180deg, #fffefb, #ffffff);
      border-radius:var(--radius-xl);
      border:1px solid var(--line);
      position:relative;
      overflow:hidden;
      width:100%;
    }

    .shell::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:18px;
      background:linear-gradient(90deg, var(--jw-beige), #cdbb79 40%, var(--jw-blue));
    }

    .shell-inner{
      position:relative;
      z-index:1;
      padding:1.1rem 1rem 1rem;
      margin-top:.35rem;
    }

    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.75rem;
      margin-bottom:.8rem;
      padding-top:.1rem;
      flex-wrap:wrap;
    }

    .section-head h2{
      font-size:.98rem;
      text-transform:uppercase;
      letter-spacing:.2em;
      color:var(--jw-blue);
      font-weight:800;
    }

    .section-head span{
      font-size:.86rem;
      color:var(--jw-blue);
      padding:.26rem .92rem;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.10);
      background:#fff;
      font-weight:700;
    }

    .view-message{
      font-size:.86rem;
      color:var(--muted);
      margin-bottom:.5rem;
      padding-left:.1rem;
    }

    .cards{
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:.95rem;
      max-height:calc(100vh - 180px);
      overflow-y:auto;
      overflow-x:hidden;
      padding-right:.15rem;
      width:100%;
    }

    .cards::-webkit-scrollbar{ width:6px; }
    .cards::-webkit-scrollbar-track{
      background:#ecebe7;
      border-radius:999px;
    }
    .cards::-webkit-scrollbar-thumb{
      background:#c8c4bb;
      border-radius:999px;
    }

    .meeting-card{
      background:linear-gradient(180deg, #ffffff, #fcfcfa);
      border-radius:var(--radius-lg);
      border:1px solid var(--line);
      overflow:hidden;
      box-shadow:var(--shadow-card);
      width:100%;
    }

    .meeting-card.destacada{
      border-color:rgba(95,111,134,.30);
      background:linear-gradient(180deg, #fafcff, #ffffff);
      box-shadow:
        0 0 0 1px rgba(95,111,134,.10),
        0 10px 24px rgba(0,0,0,.05);
      position:relative;
    }

    .meeting-card.destacada::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:4px;
      background:linear-gradient(90deg, var(--jw-blue), var(--jw-beige));
      z-index:2;
    }

    .meeting-title{
      background:linear-gradient(180deg, #eef2f7 0%, var(--jw-blue-soft) 100%);
      color:#1f2c3a;
      font-weight:800;
      font-size:clamp(1.2rem, 3.3vw, 1.85rem);
      line-height:1.16;
      padding:14px 16px;
      word-break:break-word;
      box-shadow:inset 0 -1px 0 rgba(0,0,0,.04);
    }

    .meeting-meta{
      display:flex;
      flex-wrap:wrap;
      gap:.42rem;
      padding:10px 16px 6px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:.38rem;
      padding:.28rem .82rem;
      border-radius:999px;
      background:#f7f7f7;
      border:1px solid rgba(0,0,0,.10);
      font-size:.76rem;
      color:var(--muted);
      font-weight:700;
    }

    .badge-dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:var(--jw-blue);
    }

    .meeting-body{
      display:grid;
      grid-template-columns:minmax(0, 1.05fr) minmax(0, 1.65fr);
      gap:.75rem 1rem;
      padding:12px 16px 16px;
      align-items:start;
    }

    .info-side{
      display:flex;
      flex-direction:column;
      gap:.45rem;
    }

    .meeting-label{
      font-size:.74rem;
      text-transform:uppercase;
      letter-spacing:.18em;
      color:var(--muted);
      font-weight:800;
    }

    .meeting-day{
      font-size:1.08rem;
      font-weight:800;
      line-height:1.2;
      color:#111;
    }

    .meeting-link{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:var(--jw-wine);
      text-decoration:underline;
      font-size:clamp(.94rem, 2vw, 1.04rem);
      word-break:break-word;
      cursor:pointer;
      margin-top:.2rem;
    }

    .meeting-link::before{
      content:"◉";
      color:var(--jw-wine);
      font-size:.9em;
      flex:none;
    }

    .details-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:.55rem .65rem;
    }

    .detail-group{
      display:flex;
      flex-direction:column;
      gap:.08rem;
      background:#fcfcfb;
      border:1px solid rgba(0,0,0,.07);
      border-radius:10px;
      padding:.5rem .58rem;
    }

    .detail-label{
      font-size:.7rem;
      text-transform:uppercase;
      letter-spacing:.14em;
      color:var(--muted);
      position:relative;
      padding-left:.9rem;
      font-weight:800;
      line-height:1.15;
    }

    .detail-label::before{
      content:"";
      position:absolute;
      left:0;
      top:50%;
      transform:translateY(-50%);
      width:7px;
      height:7px;
      border-radius:999px;
      background:var(--jw-blue);
    }

    .detail-label.label-presidente::before { background:#2c7fb8; }
    .detail-label.label-orador::before { background:#7c5cc4; }
    .detail-label.label-tema::before { background:#c89b00; }
    .detail-label.label-lector::before { background:#3aa35c; }
    .detail-label.label-cancion::before { background:#b45309; }
    .detail-label.label-congregacion::before { background:#64748b; }
    .detail-label.label-conductor::before { background:#0f766e; }

    .detail-value{
      font-size:.95rem;
      color:#1f1f1f;
      white-space:normal;
      font-weight:500;
      line-height:1.25;
    }

    .load-more-wrap{
      display:flex;
      justify-content:center;
      padding:10px 0 0;
    }

    .load-more{
      border:none;
      background:#111;
      color:#fff;
      border-radius:999px;
      padding:12px 18px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 10px 20px rgba(0,0,0,.08);
    }

    .empty-msg{
      font-size:.95rem;
      color:var(--muted);
      padding-top:.5rem;
    }

    body.modo-texto-grande .meeting-title{ font-size:clamp(1.28rem, 3.5vw, 1.98rem); }
    body.modo-texto-grande .meeting-day{ font-size:1.15rem; }
    body.modo-texto-grande .detail-value{ font-size:1rem; }

    @media (max-width: 700px){
      body{
        padding:.8rem .4rem 1rem;
      }

      header h1{
        font-size:1.58rem;
        line-height:1.16;
      }

      .shell-inner{
        padding:1rem .8rem .9rem;
      }

      .cards{
        max-height:none;
        overflow-y:visible;
      }

      .meeting-body{
        grid-template-columns:minmax(0, 1fr);
        padding:12px 12px 14px;
      }

      .meeting-title,
      .meeting-meta{
        padding-left:12px;
        padding-right:12px;
      }

      .details-grid{
        grid-template-columns:minmax(0,1fr);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Reunión Pública</h1>
      <div class="subhead">Programa semanal de la congregación</div>
    </header>

    <section class="shell">
      <div class="shell-inner">
        <div class="section-head">
          <h2>Programa de reuniones</h2>
          <span id="count-resumen">Cargando…</span>
        </div>

        <p id="view-message" class="view-message">Se muestra la siguiente reunión según el orden actual de la hoja.</p>

        <div id="cards" class="cards"></div>

        <div class="load-more-wrap">
          <button id="loadMoreBtn" class="load-more" style="display:none;">Ver más reuniones</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/184BIXu7VDAOyGTGEj1RvjyNE6MH05tmV_XLzQThUaoo/export?format=csv&gid=1568836904";
    const INITIAL_ITEMS = 4;
    const DIRECT_ZOOM_LINK = "https://us02web.zoom.us/j/87811088916?pwd=L1FTWDdQa203M2RHQi9iZjJBb1NnUT09";

    const cardsEl = document.getElementById("cards");
    const countResumenEl = document.getElementById("count-resumen");
    const loadMoreBtn = document.getElementById("loadMoreBtn");

    let allMeetings = [];
    let visibleItems = INITIAL_ITEMS;

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function cleanText(value) {
      if (value == null) return "";
      return String(value).replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = "";
      let inQuotes = false;
      const s = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

      for (let i = 0; i < s.length; i++) {
        const ch = s[i];
        const next = s[i + 1];

        if (ch === '"' && inQuotes && next === '"') {
          cur += '"';
          i++;
          continue;
        }
        if (ch === '"') {
          inQuotes = !inQuotes;
          continue;
        }
        if (ch === "," && !inQuotes) {
          row.push(cur);
          cur = "";
          continue;
        }
        if (ch === "\n" && !inQuotes) {
          row.push(cur);
          rows.push(row);
          row = [];
          cur = "";
          continue;
        }
        cur += ch;
      }

      if (cur.length || row.length) {
        row.push(cur);
        rows.push(row);
      }
      return rows;
    }

    function normalizarTexto(str) {
      return (str || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function isDateLabel(text) {
      return /^\d{1,2}\s+de\s+[a-záéíóú]+$/i.test(normalizarTexto(text));
    }

    function isPureDateRow(row) {
      const values = row.map(cleanText).filter(Boolean);
      return values.length === 1 && isDateLabel(values[0]);
    }

    function getFirstTwoNonEmpty(row) {
      const vals = row.map(cleanText).filter(Boolean);
      return {
        label: vals[0] || "",
        value: vals[1] || ""
      };
    }

    function createEmptyMeeting(dateText) {
      return {
        fechaTexto: dateText,
        zoom: "",
        presidente: "",
        cancion: "",
        tema: "",
        orador: "",
        congregacion: "",
        conductor: "",
        lector: ""
      };
    }

    function assignField(meeting, labelRaw, valueRaw) {
      const label = normalizarTexto(labelRaw);
      const value = cleanText(valueRaw);
      if (!label) return;

      if (label.startsWith("zoom")) meeting.zoom = value || meeting.zoom;
      else if (label.startsWith("presidente")) meeting.presidente = value || meeting.presidente;
      else if (label.startsWith("cancion") || label.startsWith("canción")) meeting.cancion = value || meeting.cancion;
      else if (label.includes("discurso especial")) meeting.tema = value || meeting.tema;
      else if (label.startsWith("orador")) meeting.orador = value || meeting.orador;
      else if (label.startsWith("congregacion") || label.startsWith("congregación")) meeting.congregacion = value || meeting.congregacion;
      else if (label.startsWith("conductor")) meeting.conductor = value || meeting.conductor;
      else if (label.startsWith("lector")) meeting.lector = value || meeting.lector;
    }

    function dedupeMeetings(meetings) {
      const seenDates = new Set();
      const result = [];

      for (const m of meetings) {
        const key = normalizarTexto(m.fechaTexto);
        if (seenDates.has(key)) continue;
        seenDates.add(key);
        result.push(m);
      }

      return result;
    }

    function parseRows(rows) {
      const meetings = [];
      let current = null;
      let started = false;

      for (const row of rows) {
        if (!row || !row.length) continue;

        if (isPureDateRow(row)) {
          const dateValue = row.map(cleanText).filter(Boolean)[0];

          if (!started) started = true;

          if (current) meetings.push(current);
          current = createEmptyMeeting(dateValue);
          continue;
        }

        if (!started || !current) continue;

        const { label, value } = getFirstTwoNonEmpty(row);
        assignField(current, label, value);
      }

      if (current) meetings.push(current);

      return dedupeMeetings(meetings);
    }

    function createDetail(label, value, cls) {
      return `
        <div class="detail-group">
          <div class="detail-label ${cls}">${escapeHtml(label)}</div>
          <div class="detail-value">${escapeHtml(value || "-")}</div>
        </div>
      `;
    }

    function renderMeeting(item, featured = false) {
      return `
        <article class="meeting-card ${featured ? "destacada" : ""}">
          <div class="meeting-title">${escapeHtml(item.fechaTexto)}</div>

          <div class="meeting-meta">
            <div class="badge">
              <span class="badge-dot"></span>
              <span>${featured ? "Siguiente reunión" : "Próxima reunión"}</span>
            </div>
          </div>

          <div class="meeting-body">
            <div class="info-side">
              <div class="meeting-label">Reunión pública</div>
              <div class="meeting-day">${escapeHtml(item.fechaTexto)}</div>
              <a href="${DIRECT_ZOOM_LINK}" class="meeting-link" target="_blank" rel="noopener noreferrer">Ingresar por Zoom</a>
            </div>

            <div class="details-grid">
              ${createDetail("Presidente", item.presidente, "label-presidente")}
              ${createDetail("Orador", item.orador, "label-orador")}
              ${createDetail("Tema", item.tema, "label-tema")}
              ${createDetail("Lector", item.lector, "label-lector")}
              ${createDetail("Canción", item.cancion, "label-cancion")}
              ${createDetail("Congregación", item.congregacion, "label-congregacion")}
              ${createDetail("Conductor", item.conductor, "label-conductor")}
            </div>
          </div>
        </article>
      `;
    }

    function render() {
      cardsEl.innerHTML = "";

      if (!allMeetings.length) {
        countResumenEl.textContent = "0 reuniones";
        cardsEl.innerHTML = `<p class="empty-msg">No encontré reuniones para mostrar.</p>`;
        loadMoreBtn.style.display = "none";
        return;
      }

      const visible = allMeetings.slice(0, visibleItems);
      countResumenEl.textContent = visible.length === 1
        ? "1 reunión visible"
        : `${allMeetings.length} reuniones visibles`;

      cardsEl.innerHTML = visible.map((item, index) => renderMeeting(item, index === 0)).join("");
      loadMoreBtn.style.display = visibleItems < allMeetings.length ? "inline-block" : "none";
    }

    async function loadSheet() {
      countResumenEl.textContent = "Cargando…";
      cardsEl.innerHTML = "";

      try {
        const response = await fetch(CSV_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("No se pudo descargar el CSV");

        const text = await response.text();
        const rows = parseCSV(text);
        allMeetings = parseRows(rows);

        render();
      } catch (error) {
        console.error(error);
        countResumenEl.textContent = "Error";
        cardsEl.innerHTML = `<p class="empty-msg">No pude cargar la hoja. Verificá que siga pública.</p>`;
      }
    }

    document.getElementById("btn-texto-grande")?.addEventListener?.("click", () => {
      document.body.classList.toggle("modo-texto-grande");
    });

    loadMoreBtn.addEventListener("click", () => {
      visibleItems += 4;
      render();
    });

    window.addEventListener("DOMContentLoaded", loadSheet);
  </script>
</body>
</html>
