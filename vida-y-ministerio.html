<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reunión Vida y Ministerio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Montserrat, Arial, sans-serif;
    }

    .wrapper {
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      position: relative;
      background: #fff;
    }

    .scaled-frame {
      transform-origin: top left;
      position: relative;
    }

    iframe {
      display: block;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <div class="scaled-frame" id="scaledFrame">
      <iframe
        id="sheetFrame"
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRmOX8-R_atSHpAXuTouDR0TvfI_N4bMsdrYvVnFWeFli0rWpfR5PpwmakytmuxokcCRhpFjn6HWm3w/pubhtml?gid=334102173&single=true&widget=false&headers=false&chrome=false"
        loading="lazy">
      </iframe>
    </div>
  </div>

  <script>
    function ajustarVista() {
      const wrapper = document.getElementById('wrapper');
      const scaledFrame = document.getElementById('scaledFrame');
      const iframe = document.getElementById('sheetFrame');

      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      // Ancho base del contenido del sheet en escritorio
      const baseWidth = 1200;

      // Escala para que SIEMPRE entre en el ancho del celular/pantalla
      let scale = viewportWidth / baseWidth;

      // En escritorio no agrandamos raro
      if (scale > 1) scale = 1;

      iframe.style.width = baseWidth + 'px';

      // Ajusta el alto interno del iframe para que el escalado no lo corte
      iframe.style.height = Math.ceil(viewportHeight / scale) + 1200 + 'px';

      scaledFrame.style.transform = `scale(${scale})`;
      scaledFrame.style.width = (baseWidth * scale) + 'px';
      scaledFrame.style.minHeight = (parseFloat(iframe.style.height) * scale) + 'px';

      wrapper.scrollTop = 0;
    }

    window.addEventListener('load', ajustarVista);
    window.addEventListener('resize', ajustarVista);
    window.addEventListener('orientationchange', ajustarVista);
  </script>
</body>
</html>
