<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reuniones - Punta Gorda : Viernes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#ffffff;
      --text:#111111;
      --muted:#6b6b6b;
      --soft:#f6f6f6;
      --line:#e6e6e6;

      --jw-beige:#efe0a1;
      --jw-black:#000000;
      --jw-wine:#8c1d40;
      --jw-gray:#4b4b4b;
      --jw-gold:#c89b00;
      --jw-red:#b30000;

      --accent:#d4af37;
      --right-line:#d7d7d7;
      --shadow:0 10px 24px rgba(0,0,0,.06);
      --radius:14px;
    }

    *{
      box-sizing:border-box;
    }

    html, body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Noto Sans", Arial, sans-serif;
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
    }

    .topbar{
      width:100%;
      background:#fff;
      border-bottom:1px solid #dadada;
      padding:14px 16px;
      font-size:clamp(1rem, 2vw, 1.35rem);
      font-weight:700;
      position:sticky;
      top:0;
      z-index:30;
    }

    .page{
      width:min(100%, 1160px);
      margin:0 auto;
      padding:18px 12px 40px;
    }

    .hero{
      height:40px;
      background:var(--jw-beige);
      border-radius:10px 10px 0 0;
    }

    .hero-black{
      height:22px;
      background:var(--jw-black);
      margin-bottom:18px;
      border-radius:0 0 10px 10px;
    }

    .status{
      padding:28px 18px;
      text-align:center;
      color:var(--muted);
      font-size:1.05rem;
    }

    .week-card{
      background:#fff;
      border:1px solid #ececec;
      border-radius:16px;
      overflow:hidden;
      margin:0 0 24px;
      box-shadow:var(--shadow);
    }

    .week-title{
      background:var(--jw-beige);
      color:#000;
      font-weight:800;
      font-size:clamp(1.45rem, 3.3vw, 2.2rem);
      line-height:1.12;
      padding:14px 16px;
      word-break:break-word;
      border-top:4px solid rgba(0,0,0,.06);
    }

    .meeting-id{
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--jw-wine);
      text-decoration:underline;
      font-size:clamp(1rem, 2vw, 1.14rem);
      padding:10px 16px 6px;
      word-break:break-word;
      cursor:pointer;
    }

    .meeting-id::before{
      content:"◉";
      color:var(--jw-wine);
      font-size:.9em;
      flex:none;
    }

    .intro-wrap,
    .section-body{
      padding:4px 0 10px;
    }

    .section{
      margin-top:8px;
      border-top:1px solid #f0f0f0;
    }

    .section-title{
      position:relative;
      color:#fff;
      font-weight:800;
      text-transform:uppercase;
      font-size:clamp(1.22rem, 3vw, 1.82rem);
      line-height:1.12;
      padding:11px 16px;
      word-break:break-word;
      letter-spacing:.01em;
    }

    .section-title::after{
      content:"";
      position:absolute;
      right:16px;
      top:50%;
      transform:translateY(-50%);
      width:14px;
      height:14px;
      border-radius:50%;
      background:rgba(255,255,255,.18);
      box-shadow:0 0 0 4px rgba(255,255,255,.08);
    }

    .section-title.gray{ background:var(--jw-gray); }
    .section-title.gold{ background:var(--jw-gold); }
    .section-title.red{ background:var(--jw-red); }

    .program-row{
      display:grid;
      grid-template-columns:minmax(0, 1.7fr) minmax(240px, .88fr);
      gap:16px;
      padding:10px 16px;
      align-items:start;
      border-bottom:1px solid rgba(0,0,0,.03);
    }

    .program-row:last-child{
      border-bottom:none;
    }

    .left-col{
      min-width:0;
      font-size:clamp(1.02rem, 2vw, 1.18rem);
      line-height:1.45;
      font-weight:700;
      word-break:break-word;
    }

    .right-col{
      min-width:0;
      padding-left:12px;
      border-left:3px solid var(--right-line);
      display:flex;
      flex-direction:column;
      gap:8px;
      align-self:start;
    }

    .assign-group{
      display:flex;
      flex-direction:column;
      gap:5px;
      padding:2px 0;
    }

    .assign-line{
      line-height:1.15;
      word-break:break-word;
    }

    .assign-role{
      display:block;
      font-size:.79rem;
      line-height:1.05;
      text-transform:uppercase;
      letter-spacing:.05em;
      color:var(--muted);
      font-weight:800;
      margin-bottom:2px;
    }

    .assign-name{
      display:block;
      font-size:clamp(.96rem, 1.8vw, 1.08rem);
      color:#222;
      font-weight:500;
    }

    .simple-line{
      padding:10px 16px;
      font-size:clamp(1.02rem, 2vw, 1.16rem);
      line-height:1.45;
      font-weight:700;
      word-break:break-word;
      border-bottom:1px solid rgba(0,0,0,.03);
    }

    .simple-line:last-child{
      border-bottom:none;
    }

    .load-more-wrap{
      display:flex;
      justify-content:center;
      padding:10px 0 0;
    }

    .load-more{
      border:none;
      background:#111;
      color:#fff;
      border-radius:999px;
      padding:12px 18px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 10px 20px rgba(0,0,0,.08);
    }

    .load-more:hover{
      opacity:.93;
    }

    .zoom-help{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index:99;
      align-items:center;
      justify-content:center;
      padding:16px;
    }

    .zoom-help.show{
      display:flex;
    }

    .zoom-help-box{
      width:min(100%, 420px);
      background:#fff;
      border-radius:16px;
      box-shadow:0 20px 40px rgba(0,0,0,.18);
      padding:18px 16px;
    }

    .zoom-help-box h3{
      margin:0 0 10px;
      font-size:1.1rem;
    }

    .zoom-help-box p{
      margin:0 0 8px;
      line-height:1.4;
      color:#333;
    }

    .zoom-help-actions{
      display:flex;
      gap:10px;
      margin-top:14px;
      flex-wrap:wrap;
    }

    .zoom-btn{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      font-weight:700;
      cursor:pointer;
    }

    .zoom-btn.primary{
      background:#111;
      color:#fff;
    }

    .zoom-btn.secondary{
      background:#f2f2f2;
      color:#111;
    }

    @media (max-width: 900px){
      .page{
        padding:0 0 28px;
      }

      .week-card{
        border-left:none;
        border-right:none;
        border-radius:0;
        box-shadow:none;
      }

      .program-row{
        grid-template-columns:minmax(0, 1.42fr) minmax(150px, .85fr);
        gap:10px;
        padding:10px 12px;
      }

      .week-title,
      .meeting-id,
      .section-title,
      .simple-line{
        padding-left:12px;
        padding-right:12px;
      }

      .left-col{
        font-size:clamp(1rem, 4.2vw, 1.1rem);
      }

      .assign-role{
        font-size:.72rem;
      }

      .assign-name{
        font-size:clamp(.9rem, 3vw, .98rem);
      }

      .right-col{
        gap:6px;
      }

      .assign-group{
        gap:4px;
      }
    }

    @media (max-width: 560px){
      .week-title{
        font-size:clamp(1.18rem, 6.9vw, 1.52rem);
      }

      .section-title{
        font-size:clamp(1.06rem, 6vw, 1.34rem);
      }

      .program-row{
        grid-template-columns:minmax(0, 1.3fr) minmax(132px, .78fr);
        gap:8px;
      }

      .left-col{
        font-size:clamp(.96rem, 4.7vw, 1.05rem);
        line-height:1.4;
      }

      .right-col{
        padding-left:8px;
        gap:4px;
      }

      .assign-group{
        gap:3px;
      }

      .assign-role{
        font-size:.66rem;
        letter-spacing:.03em;
      }

      .assign-name{
        font-size:clamp(.84rem, 2.9vw, .94rem);
        line-height:1.12;
      }

      .meeting-id{
        font-size:clamp(.92rem, 4vw, 1rem);
      }
    }
  </style>
</head>
<body>
  <div class="topbar">Reuniones - Punta Gorda : Viernes</div>

  <main class="page">
    <div class="hero"></div>
    <div class="hero-black"></div>

    <section id="content">
      <div class="status">Cargando reuniones...</div>
    </section>

    <div class="load-more-wrap">
      <button id="loadMoreBtn" class="load-more" style="display:none;">Ver más semanas</button>
    </div>
  </main>

  <div id="zoomHelp" class="zoom-help">
    <div class="zoom-help-box">
      <h3>Ingresar a la reunión</h3>
      <p id="zoomHelpText">Abriendo Zoom…</p>
      <div class="zoom-help-actions">
        <button class="zoom-btn primary" id="zoomOpenWeb">Abrir Zoom Web</button>
        <button class="zoom-btn secondary" id="zoomCopyData">Copiar ID y contraseña</button>
        <button class="zoom-btn secondary" id="zoomClose">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = "184BIXu7VDAOyGTGEj1RvjyNE6MH05tmV_XLzQThUaoo";
    const GID = "334102173";
    const INITIAL_WEEKS = 3;

    const content = document.getElementById("content");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const zoomHelp = document.getElementById("zoomHelp");
    const zoomHelpText = document.getElementById("zoomHelpText");
    const zoomOpenWeb = document.getElementById("zoomOpenWeb");
    const zoomCopyData = document.getElementById("zoomCopyData");
    const zoomClose = document.getElementById("zoomClose");

    let allWeeks = [];
    let visibleWeeks = INITIAL_WEEKS;
    let currentZoomData = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function cleanText(value) {
      if (value == null) return "";
      return String(value)
        .replace(/\u00a0/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getCell(row, index) {
      return row?.c?.[index]?.v != null ? cleanText(row.c[index].v) : "";
    }

    function isWeekTitle(text) {
      return /^(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\s/i.test(text);
    }

    function isMeetingId(text) {
      return /^ID de reunión:/i.test(text);
    }

    function detectSection(text) {
      const t = text.toUpperCase();
      if (t.includes("TESOROS DE LA BIBLIA")) return { label: text, color: "gray" };
      if (t.includes("SEAMOS MEJORES MAESTROS")) return { label: text, color: "gold" };
      if (t.includes("NUESTRA VIDA CRISTIANA")) return { label: text, color: "red" };
      return null;
    }

    function splitLinesRaw(value) {
      if (!value) return [];
      return String(value).split(/\n+/).map(cleanText).filter(Boolean);
    }

    function splitRightLines(colB, colC) {
      const leftLines = splitLinesRaw(colB);
      const rightLines = splitLinesRaw(colC);
      const max = Math.max(leftLines.length, rightLines.length);
      const result = [];

      for (let i = 0; i < max; i++) {
        const a = leftLines[i] || "";
        const b = rightLines[i] || "";

        if (!a && !b) continue;

        if (a && b) {
          result.push({ role: a.replace(/:$/, ""), name: b });
        } else if (a) {
          const parts = a.split(":");
          if (parts.length > 1) {
            result.push({
              role: cleanText(parts.shift()),
              name: cleanText(parts.join(":"))
            });
          } else {
            result.push({ role: "", name: a });
          }
        } else {
          result.push({ role: "", name: b });
        }
      }

      return result;
    }

    function buildItem(colA, colB, colC) {
      return {
        left: colA,
        rightLines: splitRightLines(colB, colC)
      };
    }

    function parseZoomData(meetingText) {
      if (!meetingText) return null;

      const idMatch = meetingText.match(/ID de reunión:\s*([\d\s]+)/i);
      const passMatch = meetingText.match(/Contraseña:\s*([^\s]+)/i);

      const meetingId = idMatch ? idMatch[1].replace(/\s+/g, "") : "";
      const passcode = passMatch ? passMatch[1].trim() : "";

      if (!meetingId) return null;

      return {
        meetingId,
        passcode,
        text: meetingText
      };
    }

    function parseWeeks(rows) {
      const weeks = [];
      let currentWeek = null;
      let currentSection = null;

      for (const row of rows) {
        const colA = getCell(row, 0);
        const colB = getCell(row, 1);
        const colC = getCell(row, 2);

        if (!colA && !colB && !colC) continue;

        if (isWeekTitle(colA)) {
          if (currentWeek) weeks.push(currentWeek);

          currentWeek = {
            title: colA,
            meetingId: "",
            intro: [],
            sections: []
          };

          currentSection = null;
          continue;
        }

        if (!currentWeek) continue;

        if (isMeetingId(colA)) {
          currentWeek.meetingId = colA;
          continue;
        }

        const section = detectSection(colA);
        if (section) {
          currentSection = {
            title: section.label,
            color: section.color,
            items: []
          };
          currentWeek.sections.push(currentSection);
          continue;
        }

        const item = buildItem(colA, colB, colC);

        if (currentSection) {
          currentSection.items.push(item);
        } else {
          currentWeek.intro.push(item);
        }
      }

      if (currentWeek) weeks.push(currentWeek);
      return weeks;
    }

    function isSeamosItem(text) {
      const t = (text || "").toUpperCase();
      return t.includes("EMPIECE CONVERSACIONES")
        || t.includes("HAGA REVISITAS")
        || t.includes("ESCENIFICACIÓN")
        || t.includes("ESCENIFICACION")
        || t.includes("PREDICACIÓN INFORMAL")
        || t.includes("PREDICACION INFORMAL");
    }

    function isEstudioCongregacion(text) {
      const t = (text || "").toUpperCase();
      return t.includes("ESTUDIO BÍBLICO DE LA CONGREGACIÓN")
        || t.includes("ESTUDIO BIBLICO DE LA CONGREGACION");
    }

    function groupAssignments(item) {
      const lines = item.rightLines || [];
      if (!lines.length) return [];

      const left = item.left || "";

      if (isSeamosItem(left)) {
        const estudiante = lines.find(x => (x.role || "").toUpperCase().includes("ESTUDIANTE"));
        const ayudante = lines.find(x => (x.role || "").toUpperCase().includes("AYUDANTE"));
        const rest = lines.filter(x => x !== estudiante && x !== ayudante);

        const groups = [];
        if (estudiante || ayudante) groups.push([estudiante, ayudante].filter(Boolean));
        rest.forEach(x => groups.push([x]));
        return groups;
      }

      if (isEstudioCongregacion(left)) {
        const conductor = lines.find(x => (x.role || "").toUpperCase().includes("CONDUCTOR"));
        const lector = lines.find(x => (x.role || "").toUpperCase().includes("LECTOR"));
        const rest = lines.filter(x => x !== conductor && x !== lector);

        const groups = [];
        if (conductor || lector) groups.push([conductor, lector].filter(Boolean));
        rest.forEach(x => groups.push([x]));
        return groups;
      }

      return lines.map(x => [x]);
    }

    function renderRightCol(item) {
      const groups = groupAssignments(item);
      if (!groups.length) return "";

      return `
        <div class="right-col">
          ${groups.map(group => `
            <div class="assign-group">
              ${group.map(line => `
                <div class="assign-line">
                  ${line.role ? `<span class="assign-role">${escapeHtml(line.role)}</span>` : ""}
                  <span class="assign-name">${escapeHtml(line.name)}</span>
                </div>
              `).join("")}
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderItem(item) {
      const hasRight = item.rightLines && item.rightLines.length > 0;

      if (!hasRight) {
        return `<div class="simple-line">${escapeHtml(item.left)}</div>`;
      }

      return `
        <div class="program-row">
          <div class="left-col">${escapeHtml(item.left)}</div>
          ${renderRightCol(item)}
        </div>
      `;
    }

    function renderMeetingLink(meetingText) {
      const zoomData = parseZoomData(meetingText);

      if (!zoomData) {
        return `<span class="meeting-id">${escapeHtml(meetingText)}</span>`;
      }

      return `
        <a
          href="#"
          class="meeting-id js-zoom-link"
          data-meeting-id="${escapeHtml(zoomData.meetingId)}"
          data-passcode="${escapeHtml(zoomData.passcode)}"
          data-meeting-text="${escapeHtml(zoomData.text)}"
        >
          ${escapeHtml(meetingText)}
        </a>
      `;
    }

    function renderWeek(week) {
      return `
        <article class="week-card">
          <div class="week-title">${escapeHtml(week.title)}</div>
          ${week.meetingId ? renderMeetingLink(week.meetingId) : ""}
          <div class="intro-wrap">
            ${week.intro.map(renderItem).join("")}
          </div>
          ${week.sections.map(section => `
            <section class="section">
              <div class="section-title ${section.color}">${escapeHtml(section.title)}</div>
              <div class="section-body">
                ${section.items.map(renderItem).join("")}
              </div>
            </section>
          `).join("")}
        </article>
      `;
    }

    function render() {
      if (!allWeeks.length) {
        content.innerHTML = `<div class="status">No encontré semanas para mostrar.</div>`;
        loadMoreBtn.style.display = "none";
        return;
      }

      const visible = allWeeks.slice(0, visibleWeeks);
      content.innerHTML = visible.map(renderWeek).join("");
      loadMoreBtn.style.display = visibleWeeks < allWeeks.length ? "inline-block" : "none";

      bindZoomLinks();
    }

    function openZoom(meetingId, passcode) {
      currentZoomData = { meetingId, passcode };

      const deepLink = `zoommtg://zoom.us/join?confno=${encodeURIComponent(meetingId)}${passcode ? `&pwd=${encodeURIComponent(passcode)}` : ""}`;
      const webJoin = "https://zoom.us/join";

      zoomHelpText.textContent = `ID: ${meetingId}${passcode ? ` · Contraseña: ${passcode}` : ""}`;
      zoomHelp.classList.add("show");

      zoomOpenWeb.onclick = () => {
        window.open(webJoin, "_blank");
      };

      zoomCopyData.onclick = async () => {
        try {
          const text = `ID de reunión: ${meetingId}${passcode ? `\nContraseña: ${passcode}` : ""}`;
          await navigator.clipboard.writeText(text);
          zoomHelpText.textContent = `Copiado. ID: ${meetingId}${passcode ? ` · Contraseña: ${passcode}` : ""}`;
        } catch (e) {
          zoomHelpText.textContent = `No pude copiar automáticamente. ID: ${meetingId}${passcode ? ` · Contraseña: ${passcode}` : ""}`;
        }
      };

      setTimeout(() => {
        window.location.href = deepLink;
      }, 150);
    }

    function bindZoomLinks() {
      document.querySelectorAll(".js-zoom-link").forEach(link => {
        link.addEventListener("click", e => {
          e.preventDefault();
          const meetingId = link.dataset.meetingId || "";
          const passcode = link.dataset.passcode || "";
          openZoom(meetingId, passcode);
        });
      });
    }

    zoomClose.addEventListener("click", () => {
      zoomHelp.classList.remove("show");
    });

    zoomHelp.addEventListener("click", (e) => {
      if (e.target === zoomHelp) {
        zoomHelp.classList.remove("show");
      }
    });

    loadMoreBtn.addEventListener("click", () => {
      visibleWeeks += 3;
      render();
    });

    async function loadSheet() {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=out:json`;
        const response = await fetch(url);
        const raw = await response.text();

        const start = raw.indexOf("{");
        const end = raw.lastIndexOf("}");

        if (start === -1 || end === -1) {
          throw new Error("Respuesta inválida de Google Sheets");
        }

        const json = JSON.parse(raw.slice(start, end + 1));
        const rows = json?.table?.rows || [];

        allWeeks = parseWeeks(rows);
        render();
      } catch (error) {
        console.error(error);
        content.innerHTML = `
          <div class="status">
            No pude cargar la hoja.<br>
            Verificá que siga pública y que el ID/GID sean correctos.
          </div>
        `;
      }
    }

    loadSheet();
  </script>
</body>
</html>
