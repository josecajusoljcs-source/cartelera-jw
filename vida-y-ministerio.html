<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reuniones - Punta Gorda : Viernes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#ffffff;
      --text:#111111;
      --muted:#6b6b6b;

      --jw-beige:#efe0a1;
      --jw-black:#000000;
      --jw-wine:#8c1d40;
      --jw-gray:#4b4b4b;
      --jw-gold:#c89b00;
      --jw-red:#b30000;

      --right-line:#d9d9d9;
    }

    *{
      box-sizing:border-box;
    }

    html, body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Noto Sans", Arial, sans-serif;
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
    }

    .topbar{
      width:100%;
      background:#fff;
      border-bottom:1px solid #d9d9d9;
      padding:14px 16px;
      font-size:clamp(1rem, 2vw, 1.35rem);
      font-weight:700;
      position:sticky;
      top:0;
      z-index:30;
    }

    .page{
      width:min(100%, 1160px);
      margin:0 auto;
      padding:18px 10px 40px;
    }

    .hero{
      height:42px;
      background:var(--jw-beige);
      margin-bottom:0;
    }

    .hero-black{
      height:24px;
      background:var(--jw-black);
      margin-bottom:16px;
    }

    .status{
      padding:26px 18px;
      text-align:center;
      color:var(--muted);
      font-size:1.05rem;
    }

    .week-card{
      background:#fff;
      border:1px solid #ebebeb;
      margin:0 0 22px;
    }

    .week-title{
      background:var(--jw-beige);
      color:#000;
      font-weight:800;
      font-size:clamp(1.45rem, 3.3vw, 2.25rem);
      line-height:1.15;
      padding:12px 14px;
      word-break:break-word;
    }

    .meeting-id{
      display:block;
      color:var(--jw-wine);
      text-decoration:underline;
      font-size:clamp(1rem, 2vw, 1.2rem);
      padding:8px 14px 4px;
      word-break:break-word;
    }

    .section{
      margin-top:8px;
    }

    .section-title{
      color:#fff;
      font-weight:800;
      text-transform:uppercase;
      font-size:clamp(1.25rem, 3vw, 1.85rem);
      line-height:1.15;
      padding:10px 14px;
      word-break:break-word;
      letter-spacing:.01em;
    }

    .section-title.gray{ background:var(--jw-gray); }
    .section-title.gold{ background:var(--jw-gold); }
    .section-title.red{ background:var(--jw-red); }

    .program-row{
      display:grid;
      grid-template-columns:minmax(0, 1.68fr) minmax(235px, .92fr);
      gap:14px;
      padding:10px 14px;
      align-items:start;
    }

    .left-col{
      min-width:0;
      font-size:clamp(1.02rem, 2vw, 1.2rem);
      line-height:1.45;
      font-weight:700;
      word-break:break-word;
    }

    .right-col{
      min-width:0;
      border-left:3px solid var(--right-line);
      padding-left:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .assign-group{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .assign-line{
      line-height:1.25;
      word-break:break-word;
    }

    .assign-role{
      display:block;
      font-size:.83rem;
      line-height:1.05;
      text-transform:uppercase;
      letter-spacing:.04em;
      color:var(--muted);
      font-weight:700;
      margin-bottom:2px;
    }

    .assign-name{
      display:block;
      font-size:clamp(.98rem, 1.8vw, 1.12rem);
      color:#222;
      font-weight:500;
    }

    .simple-line{
      padding:10px 14px;
      font-size:clamp(1.02rem, 2vw, 1.18rem);
      line-height:1.5;
      font-weight:700;
      word-break:break-word;
    }

    .load-more-wrap{
      display:flex;
      justify-content:center;
      padding:8px 0 0;
    }

    .load-more{
      border:none;
      background:#111;
      color:#fff;
      border-radius:999px;
      padding:12px 18px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
    }

    .load-more:hover{
      opacity:.92;
    }

    @media (max-width: 900px){
      .page{
        padding:0 0 28px;
      }

      .week-card{
        border-left:none;
        border-right:none;
      }

      .week-title,
      .meeting-id,
      .section-title,
      .simple-line{
        padding-left:12px;
        padding-right:12px;
      }

      .program-row{
        grid-template-columns:minmax(0, 1.5fr) minmax(145px, .82fr);
        gap:10px;
        padding:10px 12px;
      }

      .left-col{
        font-size:clamp(1rem, 4.3vw, 1.14rem);
      }

      .assign-role{
        font-size:.75rem;
      }

      .assign-name{
        font-size:clamp(.9rem, 3.2vw, 1rem);
      }

      .right-col{
        gap:6px;
      }

      .assign-group{
        gap:6px;
      }
    }

    @media (max-width: 560px){
      .week-title{
        font-size:clamp(1.22rem, 7vw, 1.6rem);
      }

      .section-title{
        font-size:clamp(1.1rem, 6.2vw, 1.45rem);
      }

      .program-row{
        grid-template-columns:minmax(0, 1.42fr) minmax(130px, .8fr);
        gap:8px;
      }

      .left-col{
        font-size:clamp(.98rem, 4.8vw, 1.08rem);
        line-height:1.42;
      }

      .right-col{
        padding-left:8px;
        gap:4px;
      }

      .assign-group{
        gap:4px;
      }

      .assign-role{
        font-size:.68rem;
        letter-spacing:.03em;
      }

      .assign-name{
        font-size:clamp(.84rem, 3vw, .96rem);
        line-height:1.16;
      }

      .meeting-id{
        font-size:clamp(.92rem, 4vw, 1rem);
      }
    }
  </style>
</head>
<body>
  <div class="topbar">Reuniones - Punta Gorda : Viernes</div>

  <main class="page">
    <div class="hero"></div>
    <div class="hero-black"></div>

    <section id="content">
      <div class="status">Cargando reuniones...</div>
    </section>

    <div class="load-more-wrap">
      <button id="loadMoreBtn" class="load-more" style="display:none;">Ver más semanas</button>
    </div>
  </main>

  <script>
    const SHEET_ID = "184BIXu7VDAOyGTGEj1RvjyNE6MH05tmV_XLzQThUaoo";
    const GID = "334102173";
    const INITIAL_WEEKS = 3;

    const content = document.getElementById("content");
    const loadMoreBtn = document.getElementById("loadMoreBtn");

    let allWeeks = [];
    let visibleWeeks = INITIAL_WEEKS;

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function cleanText(value) {
      if (value == null) return "";
      return String(value)
        .replace(/\u00a0/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getCell(row, index) {
      return row?.c?.[index]?.v != null ? cleanText(row.c[index].v) : "";
    }

    function isWeekTitle(text) {
      return /^(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\s/i.test(text);
    }

    function isMeetingId(text) {
      return /^ID de reunión:/i.test(text);
    }

    function detectSection(text) {
      const t = text.toUpperCase();
      if (t.includes("TESOROS DE LA BIBLIA")) return { label: text, color: "gray" };
      if (t.includes("SEAMOS MEJORES MAESTROS")) return { label: text, color: "gold" };
      if (t.includes("NUESTRA VIDA CRISTIANA")) return { label: text, color: "red" };
      return null;
    }

    function splitLinesRaw(value) {
      if (!value) return [];
      return String(value)
        .split(/\n+/)
        .map(cleanText)
        .filter(Boolean);
    }

    function splitRightLines(colB, colC) {
      const leftLines = splitLinesRaw(colB);
      const rightLines = splitLinesRaw(colC);

      const max = Math.max(leftLines.length, rightLines.length);
      const result = [];

      for (let i = 0; i < max; i++) {
        const a = leftLines[i] || "";
        const b = rightLines[i] || "";

        if (!a && !b) continue;

        if (a && b) {
          result.push({ role: a.replace(/:$/, ""), name: b });
        } else if (a) {
          const parts = a.split(":");
          if (parts.length > 1) {
            result.push({
              role: cleanText(parts.shift()),
              name: cleanText(parts.join(":"))
            });
          } else {
            result.push({ role: "", name: a });
          }
        } else {
          result.push({ role: "", name: b });
        }
      }

      return result;
    }

    function buildItem(colA, colB, colC) {
      return {
        left: colA,
        rightLines: splitRightLines(colB, colC)
      };
    }

    function parseWeeks(rows) {
      const weeks = [];
      let currentWeek = null;
      let currentSection = null;

      for (const row of rows) {
        const colA = getCell(row, 0);
        const colB = getCell(row, 1);
        const colC = getCell(row, 2);

        if (!colA && !colB && !colC) continue;

        if (isWeekTitle(colA)) {
          if (currentWeek) weeks.push(currentWeek);

          currentWeek = {
            title: colA,
            meetingId: "",
            intro: [],
            sections: []
          };

          currentSection = null;
          continue;
        }

        if (!currentWeek) continue;

        if (isMeetingId(colA)) {
          currentWeek.meetingId = colA;
          continue;
        }

        const section = detectSection(colA);
        if (section) {
          currentSection = {
            title: section.label,
            color: section.color,
            items: []
          };
          currentWeek.sections.push(currentSection);
          continue;
        }

        const item = buildItem(colA, colB, colC);

        if (currentSection) {
          currentSection.items.push(item);
        } else {
          currentWeek.intro.push(item);
        }
      }

      if (currentWeek) weeks.push(currentWeek);
      return weeks;
    }

    function groupAssignments(item) {
      const lines = item.rightLines || [];
      if (!lines.length) return [];

      const left = (item.left || "").toUpperCase();

      const isSeamos = left.includes("PREDICACIÓN INFORMAL") || left.includes("EMPIECE CONVERSACIONES") || left.includes("HAGA REVISITAS") || left.includes("ESCENIFICACIÓN");
      const isEstudioCong = left.includes("ESTUDIO BÍBLICO DE LA CONGREGACIÓN") || left.includes("ESTUDIO BIBLICO DE LA CONGREGACION");

      if (isSeamos) {
        const estudiante = lines.find(x => (x.role || "").toUpperCase().includes("ESTUDIANTE"));
        const ayudante = lines.find(x => (x.role || "").toUpperCase().includes("AYUDANTE"));
        const rest = lines.filter(x => x !== estudiante && x !== ayudante);

        const groups = [];
        if (estudiante || ayudante) {
          groups.push([estudiante, ayudante].filter(Boolean));
        }
        rest.forEach(x => groups.push([x]));
        return groups;
      }

      if (isEstudioCong) {
        const conductor = lines.find(x => (x.role || "").toUpperCase().includes("CONDUCTOR"));
        const lector = lines.find(x => (x.role || "").toUpperCase().includes("LECTOR"));
        const rest = lines.filter(x => x !== conductor && x !== lector);

        const groups = [];
        if (conductor || lector) {
          groups.push([conductor, lector].filter(Boolean));
        }
        rest.forEach(x => groups.push([x]));
        return groups;
      }

      return lines.map(x => [x]);
    }

    function renderRightCol(item) {
      const groups = groupAssignments(item);
      if (!groups.length) return "";

      return `
        <div class="right-col">
          ${groups.map(group => `
            <div class="assign-group">
              ${group.map(line => `
                <div class="assign-line">
                  ${line.role ? `<span class="assign-role">${escapeHtml(line.role)}</span>` : ""}
                  <span class="assign-name">${escapeHtml(line.name)}</span>
                </div>
              `).join("")}
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderItem(item) {
      const hasRight = item.rightLines && item.rightLines.length > 0;

      if (!hasRight) {
        return `<div class="simple-line">${escapeHtml(item.left)}</div>`;
      }

      return `
        <div class="program-row">
          <div class="left-col">${escapeHtml(item.left)}</div>
          ${renderRightCol(item)}
        </div>
      `;
    }

    function renderWeek(week) {
      return `
        <article class="week-card">
          <div class="week-title">${escapeHtml(week.title)}</div>
          ${week.meetingId ? `<a class="meeting-id" href="#">${escapeHtml(week.meetingId)}</a>` : ""}
          ${week.intro.map(renderItem).join("")}
          ${week.sections.map(section => `
            <section class="section">
              <div class="section-title ${section.color}">${escapeHtml(section.title)}</div>
              ${section.items.map(renderItem).join("")}
            </section>
          `).join("")}
        </article>
      `;
    }

    function render() {
      if (!allWeeks.length) {
        content.innerHTML = `<div class="status">No encontré semanas para mostrar.</div>`;
        loadMoreBtn.style.display = "none";
        return;
      }

      const visible = allWeeks.slice(0, visibleWeeks);
      content.innerHTML = visible.map(renderWeek).join("");
      loadMoreBtn.style.display = visibleWeeks < allWeeks.length ? "inline-block" : "none";
    }

    async function loadSheet() {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=out:json`;
        const response = await fetch(url);
        const raw = await response.text();

        const start = raw.indexOf("{");
        const end = raw.lastIndexOf("}");

        if (start === -1 || end === -1) {
          throw new Error("Respuesta inválida de Google Sheets");
        }

        const json = JSON.parse(raw.slice(start, end + 1));
        const rows = json?.table?.rows || [];

        allWeeks = parseWeeks(rows);
        render();
      } catch (error) {
        console.error(error);
        content.innerHTML = `
          <div class="status">
            No pude cargar la hoja.<br>
            Verificá que siga pública y que el ID/GID sean correctos.
          </div>
        `;
      }
    }

    loadMoreBtn.addEventListener("click", () => {
      visibleWeeks += 3;
      render();
    });

    loadSheet();
  </script>
</body>
</html>
