<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reuniones - Punta Gorda : Viernes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#ffffff;
      --text:#111111;
      --muted:#5d5d5d;
      --line:#d8d8d8;

      --beige:#efe0a1;
      --black:#000000;
      --wine:#8b1236;
      --green:#dff1e8;
      --gray:#4a4a4a;
      --gold:#c79c00;
      --red:#b80000;
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:'Montserrat', Arial, sans-serif;
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
    }

    .topbar{
      width:100%;
      background:#fff;
      border-bottom:1px solid #ddd;
      padding:14px 16px;
      font-size:clamp(1rem, 2.2vw, 1.35rem);
      font-weight:600;
      position:sticky;
      top:0;
      z-index:20;
    }

    .page{
      width:min(100%, 1180px);
      margin:0 auto;
      padding:18px 12px 36px;
    }

    .hero{
      background:var(--beige);
      height:42px;
      margin-bottom:0;
    }

    .hero-black{
      height:24px;
      background:var(--black);
      margin-bottom:16px;
    }

    .status{
      padding:24px 18px;
      text-align:center;
      font-size:1.05rem;
      color:var(--muted);
    }

    .week-card{
      background:#fff;
      border:1px solid #ececec;
      margin:0 0 22px;
    }

    .week-title{
      background:var(--beige);
      color:#000;
      font-weight:800;
      font-size:clamp(1.55rem, 4.6vw, 2.45rem);
      line-height:1.15;
      padding:12px 14px;
      border-top:1px solid rgba(0,0,0,.08);
      word-break:break-word;
    }

    .meeting-id{
      display:block;
      color:var(--wine);
      text-decoration:underline;
      font-size:clamp(1rem, 3.2vw, 1.25rem);
      padding:8px 14px 4px;
      word-break:break-word;
    }

    .grid-row{
      display:grid;
      grid-template-columns:minmax(0, 1.5fr) minmax(260px, .95fr);
      gap:14px;
      padding:8px 14px 10px;
      align-items:start;
    }

    .left-cell{
      font-size:clamp(1.02rem, 2.1vw, 1.25rem);
      font-weight:700;
      line-height:1.45;
      word-break:break-word;
    }

    .right-cell{
      background:var(--green);
      padding:10px 12px;
      font-size:clamp(.98rem, 1.9vw, 1.18rem);
      line-height:1.45;
      word-break:break-word;
    }

    .right-line{
      margin:0 0 4px;
    }

    .right-line:last-child{
      margin-bottom:0;
    }

    .section{
      margin-top:8px;
    }

    .section-title{
      color:#fff;
      font-weight:800;
      text-transform:uppercase;
      font-size:clamp(1.35rem, 3.6vw, 2rem);
      line-height:1.15;
      padding:10px 14px;
      word-break:break-word;
    }

    .section-title.gray{ background:var(--gray); }
    .section-title.gold{ background:var(--gold); }
    .section-title.red{ background:var(--red); }

    .simple-line{
      padding:10px 14px;
      font-size:clamp(1.02rem, 2.1vw, 1.2rem);
      line-height:1.5;
      font-weight:700;
      word-break:break-word;
    }

    .footer-space{
      height:20px;
    }

    .load-more-wrap{
      display:flex;
      justify-content:center;
      padding:10px 0 6px;
    }

    .load-more{
      border:none;
      background:#111;
      color:#fff;
      border-radius:999px;
      padding:12px 18px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
    }

    .load-more:hover{
      opacity:.92;
    }

    @media (max-width: 820px){
      .page{
        padding:0 0 24px;
      }

      .hero,
      .hero-black{
        margin-left:0;
        margin-right:0;
      }

      .week-card{
        border-left:none;
        border-right:none;
      }

      .grid-row{
        grid-template-columns:1fr;
        gap:8px;
        padding:8px 12px 10px;
      }

      .week-title{
        padding:10px 12px;
      }

      .meeting-id{
        padding:8px 12px 4px;
      }

      .section-title{
        padding:10px 12px;
      }

      .simple-line{
        padding:10px 12px;
      }

      .right-cell{
        width:100%;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">Reuniones - Punta Gorda : Viernes</div>

  <main class="page">
    <div class="hero"></div>
    <div class="hero-black"></div>

    <section id="content">
      <div class="status">Cargando reuniones...</div>
    </section>

    <div class="load-more-wrap">
      <button id="loadMoreBtn" class="load-more" style="display:none;">Ver más semanas</button>
    </div>

    <div class="footer-space"></div>
  </main>

  <script>
    const SHEET_ID = "184BIXu7VDAOyGTGEj1RvjyNE6MH05tmV_XLzQThUaoo";
    const GID = "334102173";
    const INITIAL_WEEKS = 3;

    const content = document.getElementById("content");
    const loadMoreBtn = document.getElementById("loadMoreBtn");

    let allWeeks = [];
    let visibleWeeks = INITIAL_WEEKS;

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function cleanText(value) {
      if (value == null) return "";
      return String(value)
        .replace(/\u00a0/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getCell(row, index) {
      return row?.c?.[index]?.v != null ? cleanText(row.c[index].v) : "";
    }

    function isWeekTitle(text) {
      return /^(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\s/i.test(text);
    }

    function isMeetingId(text) {
      return /^ID de reunión:/i.test(text);
    }

    function detectSection(text) {
      const t = text.toUpperCase();

      if (t.includes("TESOROS DE LA BIBLIA")) {
        return { label: text, color: "gray" };
      }

      if (t.includes("SEAMOS MEJORES MAESTROS")) {
        return { label: text, color: "gold" };
      }

      if (t.includes("NUESTRA VIDA CRISTIANA")) {
        return { label: text, color: "red" };
      }

      return null;
    }

    function splitRightLines(colB, colC) {
      const leftLines = colB ? String(colB).split(/\n+/).map(cleanText).filter(Boolean) : [];
      const rightLines = colC ? String(colC).split(/\n+/).map(cleanText).filter(Boolean) : [];

      const max = Math.max(leftLines.length, rightLines.length);
      const result = [];

      for (let i = 0; i < max; i++) {
        const a = leftLines[i] || "";
        const b = rightLines[i] || "";

        if (a && b) result.push(`${a} ${b}`);
        else if (a) result.push(a);
        else if (b) result.push(b);
      }

      return result;
    }

    function buildItem(colA, colB, colC) {
      return {
        left: colA,
        rightLines: splitRightLines(colB, colC)
      };
    }

    function parseWeeks(rows) {
      const weeks = [];
      let currentWeek = null;
      let currentSection = null;

      for (const row of rows) {
        const colA = getCell(row, 0);
        const colB = getCell(row, 1);
        const colC = getCell(row, 2);

        if (!colA && !colB && !colC) continue;

        if (isWeekTitle(colA)) {
          if (currentWeek) weeks.push(currentWeek);

          currentWeek = {
            title: colA,
            meetingId: "",
            intro: [],
            sections: []
          };

          currentSection = null;
          continue;
        }

        if (!currentWeek) continue;

        if (isMeetingId(colA)) {
          currentWeek.meetingId = colA;
          continue;
        }

        const section = detectSection(colA);
        if (section) {
          currentSection = {
            title: section.label,
            color: section.color,
            items: []
          };

          currentWeek.sections.push(currentSection);
          continue;
        }

        if (!colA && !colB && !colC) continue;

        const item = buildItem(colA, colB, colC);

        if (currentSection) {
          currentSection.items.push(item);
        } else {
          currentWeek.intro.push(item);
        }
      }

      if (currentWeek) weeks.push(currentWeek);

      return weeks;
    }

    function renderRightBox(lines) {
      if (!lines || !lines.length) return "";

      return `
        <div class="right-cell">
          ${lines.map(line => `<div class="right-line">${escapeHtml(line)}</div>`).join("")}
        </div>
      `;
    }

    function renderItem(item) {
      const hasRight = item.rightLines && item.rightLines.length > 0;

      if (hasRight) {
        return `
          <div class="grid-row">
            <div class="left-cell">${escapeHtml(item.left)}</div>
            ${renderRightBox(item.rightLines)}
          </div>
        `;
      }

      return `<div class="simple-line">${escapeHtml(item.left)}</div>`;
    }

    function renderWeek(week) {
      return `
        <article class="week-card">
          <div class="week-title">${escapeHtml(week.title)}</div>
          ${week.meetingId ? `<a class="meeting-id" href="#">${escapeHtml(week.meetingId)}</a>` : ""}
          ${week.intro.map(renderItem).join("")}
          ${week.sections.map(section => `
            <section class="section">
              <div class="section-title ${section.color}">${escapeHtml(section.title)}</div>
              ${section.items.map(renderItem).join("")}
            </section>
          `).join("")}
        </article>
      `;
    }

    function render() {
      if (!allWeeks.length) {
        content.innerHTML = `<div class="status">No encontré semanas para mostrar.</div>`;
        loadMoreBtn.style.display = "none";
        return;
      }

      const visible = allWeeks.slice(0, visibleWeeks);
      content.innerHTML = visible.map(renderWeek).join("");

      loadMoreBtn.style.display = visibleWeeks < allWeeks.length ? "inline-block" : "none";
    }

    async function loadSheet() {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=out:json`;
        const response = await fetch(url);
        const raw = await response.text();

        const start = raw.indexOf("{");
        const end = raw.lastIndexOf("}");

        if (start === -1 || end === -1) {
          throw new Error("Respuesta inválida de Google Sheets");
        }

        const json = JSON.parse(raw.slice(start, end + 1));
        const rows = json?.table?.rows || [];

        allWeeks = parseWeeks(rows);
        render();
      } catch (error) {
        console.error(error);
        content.innerHTML = `
          <div class="status">
            No pude cargar la hoja.<br>
            Verificá que siga pública y que el ID/GID sean correctos.
          </div>
        `;
      }
    }

    loadMoreBtn.addEventListener("click", () => {
      visibleWeeks += 3;
      render();
    });

    loadSheet();
  </script>
</body>
</html>
