<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reunión Vida y Ministerio</title>

  <!-- CLAVE PARA CELULAR -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow: hidden;
      font-family: Montserrat, Arial, sans-serif;
    }

    .container {
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .scale-wrapper {
      transform-origin: top left;
    }

    iframe {
      border: none;
      display: block;
      background: #fff;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="scale-wrapper" id="scaleWrapper">
    <iframe
      id="frame"
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRmOX8-R_atSHpAXuTouDR0TvfI_N4bMsdrYvVnFWeFli0rWpfR5PpwmakytmuxokcCRhpFjn6HWm3w/pubhtml?gid=334102173&single=true&widget=false&headers=false"
    ></iframe>
  </div>
</div>

<script>
  function ajustarVista() {
    const frame = document.getElementById("frame");
    const wrapper = document.getElementById("scaleWrapper");

    const screenWidth = window.innerWidth;

    // ancho real aproximado del sheet
    const baseWidth = 1100;

    // cálculo de escala
    let scale = screenWidth / baseWidth;

    // límites para que no quede ridículamente chico
    if (scale < 0.85) scale = 0.85;
    if (scale > 1) scale = 1;

    frame.style.width = baseWidth + "px";
    frame.style.height = (window.innerHeight / scale + 1000) + "px";

    wrapper.style.transform = "scale(" + scale + ")";
    wrapper.style.width = (baseWidth * scale) + "px";
  }

  window.addEventListener("load", ajustarVista);
  window.addEventListener("resize", ajustarVista);
  window.addEventListener("orientationchange", ajustarVista);
</script>

</body>
</html>
