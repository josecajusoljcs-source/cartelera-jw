<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reunión Vida y Ministerio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Montserrat, Arial, sans-serif;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      background: #fff;
    }

    .sheet-wrap {
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: #fff;
    }

    .sheet-scale {
      transform-origin: top left;
    }

    iframe {
      display: block;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="sheet-wrap" id="sheetWrap">
      <div class="sheet-scale" id="sheetScale">
        <iframe
          id="sheetFrame"
          src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRmOX8-R_atSHpAXuTouDR0TvfI_N4bMsdrYvVnFWeFli0rWpfR5PpwmakytmuxokcCRhpFjn6HWm3w/pubhtml?gid=334102173&single=true&widget=false&headers=false&chrome=false"
          loading="lazy">
        </iframe>
      </div>
    </div>
  </div>

  <script>
    function ajustarCartelera() {
      const wrap = document.getElementById("sheetWrap");
      const scaleBox = document.getElementById("sheetScale");
      const iframe = document.getElementById("sheetFrame");

      const vw = window.innerWidth;
      const vh = window.innerHeight;

      // Ancho real aproximado de la hoja publicada con la parte verde incluida
      const baseWidth = 1100;

      // Alto base grande para que permita bajar bastante
      const baseHeight = 5000;

      let scale;

      // En celular/tablet: encoge proporcionalmente para que entre TODO el ancho
      if (vw <= 900) {
        scale = vw / baseWidth;
      } else {
        // En PC mantenemos tamaño grande parecido al original
        scale = 1;
      }

      iframe.style.width = baseWidth + "px";
      iframe.style.height = baseHeight + "px";

      scaleBox.style.transform = "scale(" + scale + ")";
      scaleBox.style.width = (baseWidth * scale) + "px";
      scaleBox.style.height = (baseHeight * scale) + "px";

      wrap.style.width = "100%";
      wrap.style.minHeight = vh + "px";
    }

    window.addEventListener("load", ajustarCartelera);
    window.addEventListener("resize", ajustarCartelera);
    window.addEventListener("orientationchange", ajustarCartelera);
  </script>
</body>
</html>
